extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      http:
        # Cloud Run reaches the collector over the host's internal IP.
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  # Root-filesystem telemetry for the OS disk. Scoped to the root
  # mountpoint only: the sandbox data arrays are separate, far larger
  # filesystems with their own reclaim logic, and folding them in would
  # make utilization mean the wrong disk.
  hostmetrics:
    collection_interval: 60s
    scrapers:
      filesystem:
        include_mount_points:
          mount_points: ["/"]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 65
  resourcedetection/gcp:
    detectors: [gcp]
    timeout: 10s
    override: false

  resource/gmp_location:
    attributes:
      - key: location
        value: ${env:GCP_ZONE}
        action: upsert
  attributes/drop_internal_high_cardinality:
    actions:
      - key: sandbox_id
        action: delete
      - key: team_id
        action: delete
      - key: user_id
        action: delete
      - key: api_key_id
        action: delete
      - key: request_id
        action: delete
      - key: url
        action: delete
      - key: error
        action: delete
  # Host-level series carry the same bounded host_id label the vmd backup
  # metrics use, so alert policies scope one cell's host the same way for
  # both. HOST_ID is written into collector.env by the deploy path and
  # matches the instance name.
  attributes/host_id:
    actions:
      - key: host_id
        value: ${env:HOST_ID}
        action: upsert
  batch:
    send_batch_size: 256
    timeout: 5s

exporters:
  googlemanagedprometheus:
    project: ${env:GCP_PROJECT}
    user_agent: superserve-sandbox-otel-collector/{{version}}
    metric:
      grpc_pool_size: 1
      add_metric_suffixes: false
      extra_metrics_config:
        enable_scope_info: false
        enable_target_info: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 512

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 127.0.0.1:8888
  pipelines:
    metrics:
      receivers: [otlp, prometheus/self]
      processors: [memory_limiter, resourcedetection/gcp, resource/gmp_location, attributes/drop_internal_high_cardinality, batch]
      exporters: [googlemanagedprometheus]
    # Separate pipeline so host_id is only stamped onto host-level series;
    # OTLP senders (control plane, vmd) already set their own host_id.
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection/gcp, resource/gmp_location, attributes/host_id, batch]
      exporters: [googlemanagedprometheus]
