# Installed to /etc/systemd/system/superserve-vmd.service.d/ by the deploy
# pipeline. Deliberately a drop-in, NOT part of the main unit file: a deploy
# of an older revision overwrites the unit file with its own copy but never
# touches drop-in directories, so this guard survives the exact rollback it
# exists to gate. See vmd-rollback-guard for what it blocks.
[Service]
ExecStartPre=/usr/local/bin/vmd-rollback-guard /usr/local/bin/vmd
