# Installed to /etc/needrestart/conf.d/50-superserve.conf by deploy-vmd.
#
# Never auto-restart VM and platform units on library upgrades — restarting a
# firecracker unit destroys the customer VM inside it, and a firecracker-netns
# unit holds a live VM network namespace. Patched libraries reach these
# processes when they cycle naturally (sandbox pause/resume, platform deploys).
$nrconf{override_rc}{qr(^firecracker)} = 0;
$nrconf{override_rc}{qr(^superserve-)} = 0;
$nrconf{override_rc}{qr(^proxy\.service$)} = 0;
$nrconf{override_rc}{qr(^unbound)} = 0;
