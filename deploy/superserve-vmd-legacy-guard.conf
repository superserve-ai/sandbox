# Drop-in for the legacy socket-activated superserve-vmd.service.
#
# Once a host is migrated to the gateway topology, the bootstrap writes
# /etc/sandbox/gateway-topology. From then on the legacy pre-lease vmd unit must
# never start: it binds the public port directly (colliding with the gateway)
# and would mutate host state without holding the writer lease. This ExecStartPre
# fails when the marker exists, so systemd refuses to start the legacy unit —
# whether from socket activation, a stale enable, or a manual start.
[Service]
ExecStartPre=/usr/bin/test ! -f /etc/sandbox/gateway-topology
