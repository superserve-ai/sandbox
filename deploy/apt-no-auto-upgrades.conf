// Installed to /etc/apt/apt.conf.d/99superserve-no-auto-upgrades by deploy-vmd.
//
// VM hosts patch in deliberate maintenance windows, never automatically — an
// unattended upgrade can restart or destabilize the processes that ARE the
// customer VMs. Package-list refresh stays on so a maintenance window starts
// from an accurate view of pending updates.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "0";
