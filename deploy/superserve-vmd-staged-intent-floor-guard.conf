# Installed to /etc/systemd/system/superserve-vmd.service.d/ by the deploy
# pipeline as 31-staged-intent-floor-guard.conf. A drop-in of its own, apart
# from the wake floor's: the revision that introduced that floor reinstalls
# its guard and drop-in when deployed again, and never this one, so the
# staged-intent floor survives the exact rollback it exists to refuse.
# See vmd-staged-intent-floor-guard for what it blocks.
[Service]
ExecStartPre=/usr/local/bin/vmd-staged-intent-floor-guard /usr/local/bin/vmd
