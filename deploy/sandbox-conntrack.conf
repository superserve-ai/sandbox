# Connection-tracking sizing for sandbox hosts. Every guest connection is an
# entry and a guest can mint them far faster than they expire; at the kernel
# default of 262144 the table fills and the host drops packets for every
# sandbox and for its own control traffic. Unanswered SYN and UDP entries
# expire early so a spray drains itself. Installed by deploy-vmd.py.
net.netfilter.nf_conntrack_max = 4194304
net.netfilter.nf_conntrack_buckets = 1048576
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_udp_timeout = 15
