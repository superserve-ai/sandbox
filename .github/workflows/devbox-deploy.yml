# Deploy selected sandbox and UI revisions to an existing devbox.
#
# Re-runs the same box install scripts the create workflow uses, in contract
# order, so the upgrade exercised is the real one. Database migrations are
# applied forward by install-api.sh. Runs only from main; the selected
# revisions are built on the box. See the Set up and operate a sandbox devbox runbook.

name: Devbox Deploy

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Devbox name'
        required: true
        type: string
      sandbox_branch:
        description: 'sandbox branch (used by vmd, proxy, api)'
        required: true
        default: main
        type: string
      ui_branch:
        description: 'superserve (console) branch (used by ui)'
        required: true
        default: main
        type: string
      components:
        description: "'all' or a comma-separated subset of vmd,proxy,api,ui"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.prepare.outputs.name }}
      components: ${{ steps.prepare.outputs.components }}
      sandbox_branch: ${{ steps.prepare.outputs.sandbox_branch }}
      sandbox_sha: ${{ steps.prepare.outputs.sandbox_sha }}
      ui_branch: ${{ steps.prepare.outputs.ui_branch }}
      ui_sha: ${{ steps.prepare.outputs.ui_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and resolve branches
        id: prepare
        env:
          INPUT_NAME: ${{ inputs.name }}
          INPUT_COMPONENTS: ${{ inputs.components }}
          INPUT_SANDBOX_BRANCH: ${{ inputs.sandbox_branch }}
          INPUT_UI_BRANCH: ${{ inputs.ui_branch }}
        run: python3 .github/workflows/scripts/devbox_workflow.py prepare-deploy

  deploy:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: devbox
    timeout-minutes: 180
    # Shared with Devbox Create and Devbox Destroy so operations on one box
    # never overlap. Queued runs are kept rather than replaced, and a running
    # deploy is never cancelled for another run.
    concurrency:
      group: devbox-${{ needs.prepare.outputs.name }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.DEVBOX_GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ vars.DEVBOX_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to devbox
        env:
          DEVBOX_ATTEMPT_FILE: ${{ runner.temp }}/devbox-attempt.json
          NAME: ${{ needs.prepare.outputs.name }}
          COMPONENTS: ${{ needs.prepare.outputs.components }}
          SANDBOX_BRANCH: ${{ needs.prepare.outputs.sandbox_branch }}
          SANDBOX_SHA: ${{ needs.prepare.outputs.sandbox_sha }}
          UI_BRANCH: ${{ needs.prepare.outputs.ui_branch }}
          UI_SHA: ${{ needs.prepare.outputs.ui_sha }}
          DEVBOX_SECRET_STRIPE_SECRET_KEY: ${{ secrets.DEVBOX_SECRET_STRIPE_SECRET_KEY }}
          DEVBOX_SECRET_RECAPTCHA_API_KEY: ${{ secrets.DEVBOX_SECRET_RECAPTCHA_API_KEY }}
          DEVBOX_CONFIG_STRIPE_API_VERSION: ${{ vars.DEVBOX_CONFIG_STRIPE_API_VERSION }}
          DEVBOX_CONFIG_STRIPE_CHECKOUT_PRICE_IDS: ${{ vars.DEVBOX_CONFIG_STRIPE_CHECKOUT_PRICE_IDS }}
          DEVBOX_CONFIG_STRIPE_PRO_MONTHLY_PRICE_ID: ${{ vars.DEVBOX_CONFIG_STRIPE_PRO_MONTHLY_PRICE_ID }}
          DEVBOX_CONFIG_STRIPE_PRO_ANNUAL_PRICE_ID: ${{ vars.DEVBOX_CONFIG_STRIPE_PRO_ANNUAL_PRICE_ID }}
          DEVBOX_CONFIG_BILLING_RESOURCE_CONFIG: ${{ vars.DEVBOX_CONFIG_BILLING_RESOURCE_CONFIG }}
          DEVBOX_CONFIG_RECAPTCHA_SITE_KEY: ${{ vars.DEVBOX_CONFIG_RECAPTCHA_SITE_KEY }}
          DEVBOX_CONFIG_RECAPTCHA_PROJECT_ID: ${{ vars.DEVBOX_CONFIG_RECAPTCHA_PROJECT_ID }}
          DEVBOX_CONFIG_RECAPTCHA_SCORE_THRESHOLD: ${{ vars.DEVBOX_CONFIG_RECAPTCHA_SCORE_THRESHOLD }}
        run: python3 .github/workflows/scripts/devbox_workflow.py deploy

      - name: Mark an interrupted deploy failed
        if: failure() || cancelled()
        env:
          DEVBOX_ATTEMPT_FILE: ${{ runner.temp }}/devbox-attempt.json
          NAME: ${{ needs.prepare.outputs.name }}
          COMPONENTS: ${{ needs.prepare.outputs.components }}
          SANDBOX_BRANCH: ${{ needs.prepare.outputs.sandbox_branch }}
          SANDBOX_SHA: ${{ needs.prepare.outputs.sandbox_sha }}
          UI_BRANCH: ${{ needs.prepare.outputs.ui_branch }}
          UI_SHA: ${{ needs.prepare.outputs.ui_sha }}
        run: python3 .github/workflows/scripts/devbox_workflow.py finish-deploy
