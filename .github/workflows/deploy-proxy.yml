# Two-phase rollout: leave PEER_ROUTING_ENABLED (staging) and production variables
# PEER_ROUTING_ENABLED_USE4 / PEER_ROUTING_ENABLED_USW unset while deploying ingress
# to every owner in every reachable region. Enable each cell independently
# with value 1 only after all ingress deployments and readiness checks succeed.
# On partial failure keep routing disabled and complete the ingress rollout.
# Before removing ingress or rolling back to an older binary, disable routing
# across the fleet first. Never enable routing in the initial ingress deployment.
# Deploy Proxy — edge proxy on the VMD hosts.
#
# Staging runs first; production standby deploys may skip an absent staging
# standby, matching Deploy VMD. Normal deployments run west after the primary
# region succeeds — same shape as Deploy API's usw steps.

name: Deploy Proxy

# Serialize with Deploy VMD rather than canceling: both workflows rewrite
# /etc/sandbox/vmd.env and restart VMD on the same hosts. A queued run starts
# only after the other deployment has completed its non-atomic update.
concurrency:
  group: deploy-vmd
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production
      target:
        description: 'Host target'
        required: true
        type: choice
        default: serving
        options:
          - serving
          - standby
      production_cell:
        description: 'Production cell for manual deployments'
        required: true
        type: choice
        default: usw2
        options:
          - usw2
          - use4
  push:
    branches: [main]
    paths:
      # Every internal package the proxy imports must be listed, or a change to
      # it merges without deploying. Enforced by the deploy-trigger-coverage CI
      # check against `go list -deps`.
      - 'cmd/proxy/**'
      - 'cmd/check-legacy-heartbeat/**'
      - 'internal/analytics/**'
      - 'internal/auth/**'
      - 'internal/preview/**'
      - 'internal/proxy/**'
      - 'internal/db/**'
      - 'internal/sentrylog/**'
      - 'internal/telemetry/**'
      - 'internal/vmdclient/**'
      - 'proto/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/proxy.service'
      - '.github/workflows/deploy-proxy.yml'
      - '.github/workflows/scripts/deploy-proxy.py'
      - '.github/workflows/scripts/select-deploy-target.sh'

env:
  DEPLOY_EVENT: ${{ github.event_name }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
  DEPLOY_TARGET: ${{ inputs.target || 'serving' }}
  DEPLOY_PRODUCTION_CELL: ${{ inputs.production_cell || 'usw2' }}

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require host identity readiness for automatic rollout
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          ROLLOUT_READY: ${{ vars.HOST_IDENTITY_ROLLOUT_READY }}
        run: |
          if [ "$DEPLOY_EVENT" = push ] && [ "${ROLLOUT_READY:-}" != true ]; then
            echo 'Host identity migration is not complete; use the coordinated manual rollout procedure.' >&2
            exit 1
          fi

  deploy-staging:
    needs: [migration-gate]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build proxy binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -o bin/proxy ./cmd/proxy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/check-legacy-heartbeat ./cmd/check-legacy-heartbeat

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # GCP_REGION scopes label discovery to the primary region so the
      # usw cell host (same project, same label) isn't folded into this
      # fan-out — the cell deploys sequentially after production below.
      - name: Discover and deploy proxy to VMD instances
        env:
          DEPLOY_CELL: staging
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          SANDBOX_ACCESS_TOKEN_SEED: ${{ secrets.SANDBOX_ACCESS_TOKEN_SEED_STAGING }}
          PROXY_DATABASE_URL: ${{ secrets.PROXY_DATABASE_URL_STAGING }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS_STAGING }}
          PROXY_DOMAIN: ${{ vars.PROXY_DOMAIN_STAGING }}
          # Enables the proxy's OTLP exporter (host-local collector) so the
          # data-plane exec phase histograms export.
          OTEL_ENVIRONMENT: staging
          PROXY_DOMAINS: ${{ vars.PROXY_DOMAINS_STAGING }}
          REQUIRE_DATA_PLANE: ${{ vars.REQUIRE_DATA_PLANE_STAGING }}
          # Bootstrap owns each host's identity and certificate paths.
          # Host 1 retains its legacy peer configuration.
          # Require bootstrap only after this cell's operator-run migration.
          PEER_IDENTITY_HOSTS: ${{ vars.HOST2_PEER_IDENTITY_READY_STAGING == 'true' && 'superserve-vmd-staging-2' || '' }}
          # Routing-enabled hosts must remain reachable by their peers.
          PEER_PROXY_LISTEN_ADDR: ${{ vars.PEER_ROUTING_ENABLED == '1' && 'auto' || vars.PEER_PROXY_LISTEN_ADDR_STAGING }}
          PEER_PROXY_TARGET_ADDR: "127.0.0.1:5010"
          PEER_PROXY_CERT_FILE: "/etc/superserve/peer/tls.crt"
          PEER_PROXY_KEY_FILE: "/etc/superserve/peer/tls.key"
          PEER_PROXY_CA_FILE: "/etc/superserve/peer/ca.crt"
          PEER_ROUTING_ENABLED: ${{ vars.PEER_ROUTING_ENABLED }}
          PEER_PROXY_MAX_STREAMS: ${{ vars.PEER_PROXY_MAX_STREAMS }}
        run: |
          if [ "$DEPLOY_EVENT" = workflow_dispatch ] && [ "$DEPLOY_TARGET" = standby ]; then
            source .github/workflows/scripts/select-deploy-target.sh
          elif [ "$DEPLOY_TARGET" != serving ] && [ "$DEPLOY_EVENT" = workflow_dispatch ]; then
            echo 'Invalid deploy target' >&2
            exit 1
          fi
          : "${GCP_REGION:?Refusing an unscoped proxy deployment}"
          python3 .github/workflows/scripts/deploy-proxy.py

  deploy-production:
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build proxy binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -o bin/proxy ./cmd/proxy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/check-legacy-heartbeat ./cmd/check-legacy-heartbeat

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # us-east4 is the "use" cell's primary host (api.superserve.ai routes to
      # the use-cell control plane there). It deploys FIRST so a usw-cell failure
      # below can't leave the primary host on a stale proxy. Reuses the primary
      # proxy env (domain + seed) since it is the same cell. For normal deploys, use4 is
      # the permanent primary, so a missing GCP_REGION_USE4 must fail the deploy
      # rather than silently skip the only primary-host proxy rollout
      # (deploy-proxy.py fails on zero VMD_LABEL matches).
      - name: Deploy proxy to us-east4 use-cell VMD instance
        if: github.event_name != 'workflow_dispatch' || inputs.production_cell == 'use4'
        env:
          DEPLOY_CELL: use4
          VMD_STANDBY_HOST_USE4: ${{ vars.VMD_STANDBY_HOST_USE4 }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USE4 }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          SANDBOX_ACCESS_TOKEN_SEED: ${{ secrets.SANDBOX_ACCESS_TOKEN_SEED_PROD }}
          PROXY_DATABASE_URL: ${{ secrets.PROXY_DATABASE_URL_PROD }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS_PROD }}
          PROXY_DOMAIN: ${{ vars.PROXY_DOMAIN_PROD }}
          OTEL_ENVIRONMENT: production
          PROXY_DOMAINS: ${{ vars.PROXY_DOMAINS_PROD }}
          REQUIRE_DATA_PLANE: ${{ vars.REQUIRE_DATA_PLANE_PROD }}
          # Outbound routing does not require this host to accept peer ingress.
          PEER_PROXY_LISTEN_ADDR: ${{ (vars.PEER_INGRESS_ENABLED_PROD == '1' || (github.event_name == 'workflow_dispatch' && inputs.target == 'standby')) && 'auto' || '' }}
          PEER_PROXY_TARGET_ADDR: "127.0.0.1:5010"
          PEER_PROXY_CERT_FILE: "/etc/superserve/peer/tls.crt"
          PEER_PROXY_KEY_FILE: "/etc/superserve/peer/tls.key"
          PEER_PROXY_CA_FILE: "/etc/superserve/peer/ca.crt"
          PEER_ROUTING_ENABLED: ${{ vars.PEER_ROUTING_ENABLED_USE4 }}
          PEER_PROXY_MAX_STREAMS: ${{ vars.PEER_PROXY_MAX_STREAMS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ "$DEPLOY_EVENT" = workflow_dispatch ] && [ "$DEPLOY_TARGET" = standby ]; then
            source .github/workflows/scripts/select-deploy-target.sh
          elif [ "$DEPLOY_TARGET" != serving ] && [ "$DEPLOY_EVENT" = workflow_dispatch ]; then
            echo 'Invalid deploy target' >&2
            exit 1
          fi
          : "${GCP_REGION:?Refusing an unscoped proxy deployment}"
          python3 .github/workflows/scripts/deploy-proxy.py

      # The usw cell deploys as a step in this job — not a separate job —
      # for the same reason Deploy API / CD Migrate / Seed Templates do it
      # this way: a second job referencing the production environment would
      # double any approval gate. Running after the primary step means a bad
      # rollout stops at the primary, and the step reuses the binary built
      # above (build once, deploy per region). On push, skipped until
      # CLOUD_RUN_SERVICE_USW (the repo-level cell-exists flag) is set.
      # Discovery is the same VMD_LABEL filter scoped to GCP_REGION_USW, so
      # the cell host must carry the label; zero matches fails the deploy
      # rather than silently skipping the cell.
      #
      # The deploy rewrites /etc/sandbox/proxy.env on the host, so the cell
      # MUST NOT reuse the prod values: its domain differs per the
      # regional hostname scheme
      # (PROXY_DOMAIN_USW = usw-sandbox.superserve.ai) and its token seed
      # lives in Secret Manager (`sandbox-access-token-seed`), which is what
      # the cell control plane signs with — writing the primary's seed here
      # would break every access token in the cell. The seed is fetched at
      # deploy time so Secret Manager stays the single source of truth.
      - name: Deploy proxy to usw cell VMD instances
        if: (github.event_name == 'workflow_dispatch' && (inputs.production_cell == 'usw2' || inputs.production_cell == '')) || (github.event_name != 'workflow_dispatch' && vars.CLOUD_RUN_SERVICE_USW != '')
        env:
          DEPLOY_CELL: usw2
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USW }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS_PROD }}
          PROXY_DATABASE_URL: ${{ secrets.PROXY_DATABASE_URL_USWEST }}
          PROXY_DOMAIN: ${{ vars.PROXY_DOMAIN_USW }}
          # Production opts in separately after its staging-proven migration.
          PEER_IDENTITY_HOSTS: ${{ vars.HOST2_PEER_IDENTITY_READY_USW == 'true' && 'superserve-vmd-usw2-2' || '' }}
          OTEL_ENVIRONMENT: production
          PROXY_DOMAINS: ${{ vars.PROXY_DOMAINS_USW }}
          REQUIRE_DATA_PLANE: ${{ vars.REQUIRE_DATA_PLANE_PROD }}
          # Outbound routing does not require this host to accept peer ingress.
          PEER_PROXY_LISTEN_ADDR: ${{ (vars.PEER_INGRESS_ENABLED_USW == '1' || (github.event_name == 'workflow_dispatch' && inputs.target == 'standby')) && 'auto' || '' }}
          PEER_PROXY_TARGET_ADDR: "127.0.0.1:5010"
          PEER_PROXY_CERT_FILE: "/etc/superserve/peer/tls.crt"
          PEER_PROXY_KEY_FILE: "/etc/superserve/peer/tls.key"
          PEER_PROXY_CA_FILE: "/etc/superserve/peer/ca.crt"
          PEER_ROUTING_ENABLED: ${{ vars.PEER_ROUTING_ENABLED_USW }}
          PEER_PROXY_MAX_STREAMS: ${{ vars.PEER_PROXY_MAX_STREAMS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ "$DEPLOY_EVENT" = workflow_dispatch ] && [ "$DEPLOY_TARGET" = standby ]; then
            source .github/workflows/scripts/select-deploy-target.sh
          elif [ "$DEPLOY_TARGET" != serving ] && [ "$DEPLOY_EVENT" = workflow_dispatch ]; then
            echo 'Invalid deploy target' >&2
            exit 1
          fi
          : "${GCP_REGION:?Refusing an unscoped proxy deployment}"
          SANDBOX_ACCESS_TOKEN_SEED=$(gcloud secrets versions access latest \
            --secret=sandbox-access-token-seed --project "$GCP_PROJECT")
          export SANDBOX_ACCESS_TOKEN_SEED
          python3 .github/workflows/scripts/deploy-proxy.py
