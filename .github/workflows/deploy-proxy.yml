# Deploy and verify ingress on every remote destination before enabling routing
# on its source hosts. Production routing does not enable ingress on the source;
# serving ingress uses the cell's ingress variable, and manual standby forces it.
# On partial destination rollout failure, keep source routing disabled.
# Before removing a destination's ingress or rolling it back to an older binary,
# disable routing on every source that can reach it and drain existing streams.
# Deploy Proxy — edge proxy on the VMD hosts.
#
# Staging runs first; production standby deploys may skip an absent staging
# standby, matching Deploy VMD. Normal deployments run west after the primary
# region succeeds — same shape as Deploy API's usw steps.

name: Deploy Proxy

# Durable cell ownership and host flock also serialize interrupted sessions.
concurrency:
  group: deploy-vmd
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production
      target:
        description: 'Host target'
        required: true
        type: choice
        default: serving
        options:
          - serving
          - standby
      revision:
        description: 'Original commit SHA when resuming an interrupted rollout'
        required: false
        type: string
      rollout_id:
        description: 'Original rollout ID when resuming an interrupted run; use the same revision and inputs'
        required: false
        type: string
      operation:
        description: 'Prepare or resume the bootstrap generation around Terraform frontend migration, or deploy'
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - bootstrap
      production_cell:
        description: 'Production cell for manual deployments'
        required: true
        type: choice
        default: usw2
        options:
          - usw2
          - use4
  push:
    branches: [main]
    paths:
      # Every internal package the proxy imports must be listed, or a change to
      # it merges without deploying. Enforced by the deploy-trigger-coverage CI
      # check against `go list -deps`.
      - 'cmd/proxy/**'
      - 'cmd/check-legacy-heartbeat/**'
      - 'internal/analytics/**'
      - 'internal/auth/**'
      - 'internal/preview/**'
      - 'internal/proxy/**'
      - 'internal/db/**'
      - 'internal/sentrylog/**'
      - 'internal/telemetry/**'
      - 'internal/vmdclient/**'
      - 'proto/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/proxy.service'
      - 'deploy/proxy.socket'
      - 'deploy/proxy-generation.service'
      - 'deploy/refresh-peer-credentials.py'
      - '.github/workflows/scripts/proxy_rollout.py'
      - '.github/workflows/deploy-proxy.yml'
      - '.github/workflows/scripts/deploy-proxy.py'
      - '.github/workflows/scripts/select-deploy-target.sh'

env:
  PROXY_ROLLOUT_ID: ${{ inputs.rollout_id || github.run_id }}
  PROXY_OPERATION: ${{ inputs.operation || 'deploy' }}
  PROXY_ROLLOUT_MANIFESTS: bin/proxy-rollout.json
  # These repository variables are populated only after the executable
  # Notion runbook is published and its staging evidence is recorded.
  PROXY_GENERATION_RUNBOOK_URL: ${{ vars.PROXY_GENERATION_RUNBOOK_URL }}
  PROXY_GENERATION_PROMOTION_EVIDENCE_URL: ${{ vars.PROXY_GENERATION_PROMOTION_EVIDENCE_URL }}
  PROXY_GENERATION_PROMOTION_EVIDENCE_STATUS: ${{ vars.PROXY_GENERATION_PROMOTION_EVIDENCE_STATUS }}
  DEPLOY_EVENT: ${{ github.event_name }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
  DEPLOY_TARGET: ${{ inputs.target || 'serving' }}
  # Carry the selected role into the immutable host request.  The remote
  # controller must not infer serving behavior from a reused cell manifest.
  PROXY_TARGET: ${{ inputs.target || 'serving' }}
  DEPLOY_PRODUCTION_CELL: ${{ inputs.production_cell || 'usw2' }}

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate deployment revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_ROLLOUT_ID: ${{ inputs.rollout_id }}
        run: |
          set -euo pipefail
          [ "$CURRENT_REF" = refs/heads/main ] || { echo 'Deployments must be dispatched from main.' >&2; exit 1; }
          revision="$CURRENT_SHA"
          if [ -n "$REQUESTED_REVISION$REQUESTED_ROLLOUT_ID" ]; then
            [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Retry requires the original full commit SHA.' >&2; exit 1; }
            [[ "$REQUESTED_ROLLOUT_ID" =~ ^[0-9]+$ ]] || { echo 'Retry requires the original workflow run ID.' >&2; exit 1; }
            gh api "repos/$GH_REPO/actions/runs/$REQUESTED_ROLLOUT_ID" > original-run.json
            jq -e --arg sha "$REQUESTED_REVISION" '
              .head_sha == $sha and .head_branch == "main" and
              .path == ".github/workflows/deploy-proxy.yml" and
              (.event == "push" or .event == "workflow_dispatch")
            ' original-run.json > /dev/null
            revision="$REQUESTED_REVISION"
          fi
          git merge-base --is-ancestor "$revision" origin/main
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Require host identity readiness for automatic rollout
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          ROLLOUT_READY: ${{ vars.HOST_IDENTITY_ROLLOUT_READY }}
          GENERATION_READY: ${{ vars.PROXY_GENERATION_PROMOTION_READY }}
          RUNBOOK_URL: ${{ vars.PROXY_GENERATION_RUNBOOK_URL }}
          EVIDENCE_URL: ${{ vars.PROXY_GENERATION_PROMOTION_EVIDENCE_URL }}
          EVIDENCE_STATUS: ${{ vars.PROXY_GENERATION_PROMOTION_EVIDENCE_STATUS }}
        run: |
          if [ "$DEPLOY_EVENT" = push ] && [ "${GENERATION_READY:-}" != true ]; then
            echo 'Generation migration and staging promotion evidence are required before automatic rollout.' >&2
            exit 1
          fi
          if [ "$DEPLOY_EVENT" = push ]; then
            notion_url_pattern='^https://(([A-Za-z0-9-]+\.)?(notion\.so|notion\.site)|app\.notion\.com)/[^[:space:]<>#]+$'
            https_url_pattern='^https://[^[:space:]<>#]+$'
            if [[ ! "${RUNBOOK_URL:-}" =~ $notion_url_pattern ]] ||
               [[ ! "${EVIDENCE_URL:-}" =~ $https_url_pattern ]] ||
               [ "${EVIDENCE_STATUS:-}" != passed ]; then
              echo 'Generation promotion requires a published Notion runbook, immutable HTTPS staging evidence link, and passed evidence status.' >&2
              exit 1
            fi
          fi
          if [ "$DEPLOY_EVENT" = push ] && [ "${ROLLOUT_READY:-}" != true ]; then
            echo 'Host identity migration is not complete; use the coordinated manual rollout procedure.' >&2
            exit 1
          fi

  deploy-staging:
    needs: [migration-gate]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.migration-gate.outputs.revision }}

      - name: Record proxy revision
        run: echo "PROXY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build proxy binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -o bin/proxy ./cmd/proxy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/check-legacy-heartbeat ./cmd/check-legacy-heartbeat

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read applied proxy manifests from the owning state
        run: |
          umask 077
          terraform -chdir=infra/envs/staging/us-central1 init -input=false
          if [ "${{ inputs.operation || 'deploy' }}" = bootstrap ] && [ "${{ inputs.environment || 'staging' }}" = staging ]; then
            terraform -chdir=infra/envs/staging/us-central1 output -json proxy_generation_bootstrap > "$PROXY_ROLLOUT_MANIFESTS"
          else
            terraform -chdir=infra/envs/staging/us-central1 output -json proxy_generation_rollout > "$PROXY_ROLLOUT_MANIFESTS"
          fi

      # GCP_REGION scopes label discovery to the primary region so the
      # usw cell host (same project, same label) isn't folded into this
      # fan-out — the cell deploys sequentially after production below.
      - name: Discover and deploy proxy to VMD instances
        env:
          DEPLOY_CELL: staging
          # Production bootstrap still verifies the already-promoted staging deployment.
          PROXY_OPERATION: ${{ inputs.environment == 'production' && 'deploy' || inputs.operation || 'deploy' }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ env.PROXY_REVISION }}
          SANDBOX_ACCESS_TOKEN_SEED: ${{ secrets.SANDBOX_ACCESS_TOKEN_SEED_STAGING }}
          PROXY_DATABASE_URL: ${{ secrets.PROXY_DATABASE_URL_STAGING }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS_STAGING }}
          PROXY_DOMAIN: ${{ vars.PROXY_DOMAIN_STAGING }}
          # Enables the proxy's OTLP exporter (host-local collector) so the
          # data-plane exec phase histograms export.
          OTEL_ENVIRONMENT: staging
          PROXY_DOMAINS: ${{ vars.PROXY_DOMAINS_STAGING }}
          REQUIRE_DATA_PLANE: ${{ vars.REQUIRE_DATA_PLANE_STAGING }}
          # Bootstrap owns each host's identity and certificate paths.
          # Host 1 retains its legacy peer configuration.
          # Require bootstrap only after this cell's operator-run migration.
          PEER_IDENTITY_HOSTS: ${{ vars.HOST2_PEER_IDENTITY_READY_STAGING == 'true' && 'superserve-vmd-staging-2' || '' }}
          # Routing-enabled hosts must remain reachable by their peers.
          PEER_PROXY_LISTEN_ADDR: ${{ vars.PEER_ROUTING_ENABLED == '1' && 'auto' || vars.PEER_PROXY_LISTEN_ADDR_STAGING }}
          PEER_PROXY_TARGET_ADDR: "127.0.0.1:5010"
          PEER_PROXY_CERT_FILE: "/etc/superserve/peer/tls.crt"
          PEER_PROXY_KEY_FILE: "/etc/superserve/peer/tls.key"
          PEER_PROXY_CA_FILE: "/etc/superserve/peer/ca.crt"
          PEER_ROUTING_ENABLED: ${{ vars.PEER_ROUTING_ENABLED }}
          PEER_PROXY_MAX_STREAMS: ${{ vars.PEER_PROXY_MAX_STREAMS }}
        run: |
          if [ "$DEPLOY_EVENT" = workflow_dispatch ] && [ "$DEPLOY_TARGET" = standby ]; then
            source .github/workflows/scripts/select-deploy-target.sh
          elif [ "$DEPLOY_TARGET" != serving ] && [ "$DEPLOY_EVENT" = workflow_dispatch ]; then
            echo 'Invalid deploy target' >&2
            exit 1
          fi
          : "${GCP_REGION:?Refusing an unscoped proxy deployment}"
          python3 .github/workflows/scripts/deploy-proxy.py

  deploy-production:
    if: (github.event_name == 'push' || github.event.inputs.environment == 'production') && vars.PROXY_GENERATION_PROMOTION_READY == 'true' && vars.PROXY_GENERATION_PROMOTION_EVIDENCE_STATUS == 'passed' && vars.PROXY_GENERATION_RUNBOOK_URL != '' && vars.PROXY_GENERATION_PROMOTION_EVIDENCE_URL != ''
    needs: [migration-gate, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.migration-gate.outputs.revision }}

      - name: Validate linked staging promotion evidence
        env:
          RUNBOOK_URL: ${{ vars.PROXY_GENERATION_RUNBOOK_URL }}
          EVIDENCE_URL: ${{ vars.PROXY_GENERATION_PROMOTION_EVIDENCE_URL }}
          EVIDENCE_STATUS: ${{ vars.PROXY_GENERATION_PROMOTION_EVIDENCE_STATUS }}
        run: |
          set -eu
          notion_url_pattern='^https://(([A-Za-z0-9-]+\.)?(notion\.so|notion\.site)|app\.notion\.com)/[^[:space:]<>#]+$'
          https_url_pattern='^https://[^[:space:]<>#]+$'
          if [[ ! "$RUNBOOK_URL" =~ $notion_url_pattern ]] ||
             [[ ! "$EVIDENCE_URL" =~ $https_url_pattern ]] ||
             [ "$EVIDENCE_STATUS" != passed ]; then
            echo 'Linked Notion runbook or staging promotion evidence is missing or invalid; refusing production deployment.' >&2
            exit 1
          fi
          {
            echo '### Proxy generation promotion evidence'
            # Actions summaries are public for this repository.  Keep the
            # configured runbook/evidence URLs out of the summary because the
            # gate intentionally accepts links whose access may be private.
            echo "- Evidence status: $EVIDENCE_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record proxy revision
        run: echo "PROXY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build proxy binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -o bin/proxy ./cmd/proxy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/check-legacy-heartbeat ./cmd/check-legacy-heartbeat

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read applied us-east4 proxy manifests from the owning state
        if: github.event_name != 'workflow_dispatch' || inputs.production_cell == 'use4'
        run: |
          umask 077
          terraform -chdir=infra/envs/production/us-east4 init -input=false
          if [ "${{ inputs.operation || 'deploy' }}" = bootstrap ]; then
            terraform -chdir=infra/envs/production/us-east4 output -json proxy_generation_bootstrap > "$PROXY_ROLLOUT_MANIFESTS"
          else
            terraform -chdir=infra/envs/production/us-east4 output -json proxy_generation_rollout > "$PROXY_ROLLOUT_MANIFESTS"
          fi

      # us-east4 is the "use" cell's primary host (api.superserve.ai routes to
      # the use-cell control plane there). It deploys FIRST so a usw-cell failure
      # below can't leave the primary host on a stale proxy. Reuses the primary
      # proxy env (domain + seed) since it is the same cell. For normal deploys, use4 is
      # the permanent primary, so a missing GCP_REGION_USE4 must fail the deploy
      # rather than silently skip the only primary-host proxy rollout
      # (deploy-proxy.py fails on zero VMD_LABEL matches).
      - name: Deploy proxy to us-east4 use-cell VMD instance
        if: github.event_name != 'workflow_dispatch' || inputs.production_cell == 'use4'
        env:
          DEPLOY_CELL: use4
          # Host 3 requires managed identity regardless of its serving role.
          PEER_IDENTITY_HOSTS: superserve-vmd-use4-3
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USE4 }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ env.PROXY_REVISION }}
          SANDBOX_ACCESS_TOKEN_SEED: ${{ secrets.SANDBOX_ACCESS_TOKEN_SEED_PROD }}
          PROXY_DATABASE_URL: ${{ secrets.PROXY_DATABASE_URL_PROD }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS_PROD }}
          PROXY_DOMAIN: ${{ vars.PROXY_DOMAIN_PROD }}
          OTEL_ENVIRONMENT: production
          PROXY_DOMAINS: ${{ vars.PROXY_DOMAINS_PROD }}
          REQUIRE_DATA_PLANE: ${{ vars.REQUIRE_DATA_PLANE_PROD }}
          # Outbound routing does not require this host to accept peer ingress.
          PEER_PROXY_LISTEN_ADDR: ${{ (vars.PEER_INGRESS_ENABLED_PROD == '1' || (github.event_name == 'workflow_dispatch' && inputs.target == 'standby')) && 'auto' || '' }}
          PEER_PROXY_TARGET_ADDR: "127.0.0.1:5010"
          PEER_PROXY_CERT_FILE: "/etc/superserve/peer/tls.crt"
          PEER_PROXY_KEY_FILE: "/etc/superserve/peer/tls.key"
          PEER_PROXY_CA_FILE: "/etc/superserve/peer/ca.crt"
          PEER_ROUTING_ENABLED: ${{ vars.PEER_ROUTING_ENABLED_USE4 }}
          PEER_PROXY_MAX_STREAMS: ${{ vars.PEER_PROXY_MAX_STREAMS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ "$DEPLOY_EVENT" = workflow_dispatch ] && [ "$DEPLOY_TARGET" = standby ]; then
            source .github/workflows/scripts/select-deploy-target.sh
          elif [ "$DEPLOY_TARGET" != serving ] && [ "$DEPLOY_EVENT" = workflow_dispatch ]; then
            echo 'Invalid deploy target' >&2
            exit 1
          fi
          : "${GCP_REGION:?Refusing an unscoped proxy deployment}"
          python3 .github/workflows/scripts/deploy-proxy.py

      - name: Read applied us-west2 proxy manifests from the owning state
        if: (github.event_name == 'workflow_dispatch' && (inputs.production_cell == 'usw2' || inputs.production_cell == '')) || (github.event_name != 'workflow_dispatch' && vars.CLOUD_RUN_SERVICE_USW != '')
        run: |
          umask 077
          terraform -chdir=infra/envs/production/us-west2 init -input=false
          if [ "${{ inputs.operation || 'deploy' }}" = bootstrap ]; then
            terraform -chdir=infra/envs/production/us-west2 output -json proxy_generation_bootstrap > "$PROXY_ROLLOUT_MANIFESTS"
          else
            terraform -chdir=infra/envs/production/us-west2 output -json proxy_generation_rollout > "$PROXY_ROLLOUT_MANIFESTS"
          fi

      # The usw cell deploys as a step in this job — not a separate job —
      # for the same reason Deploy API / CD Migrate / Seed Templates do it
      # this way: a second job referencing the production environment would
      # double any approval gate. Running after the primary step means a bad
      # rollout stops at the primary, and the step reuses the binary built
      # above (build once, deploy per region). On push, skipped until
      # CLOUD_RUN_SERVICE_USW (the repo-level cell-exists flag) is set.
      # Discovery is the same VMD_LABEL filter scoped to GCP_REGION_USW, so
      # the cell host must carry the label; zero matches fails the deploy
      # rather than silently skipping the cell.
      #
      # Each generation receives its own environment file, so the cell
      # MUST NOT reuse the prod values: its domain differs per the
      # regional hostname scheme
      # (PROXY_DOMAIN_USW = usw-sandbox.superserve.ai) and its token seed
      # lives in Secret Manager (`sandbox-access-token-seed`), which is what
      # the cell control plane signs with — writing the primary's seed here
      # would break every access token in the cell. The seed is fetched at
      # deploy time so Secret Manager stays the single source of truth.
      - name: Deploy proxy to usw cell VMD instances
        if: (github.event_name == 'workflow_dispatch' && (inputs.production_cell == 'usw2' || inputs.production_cell == '')) || (github.event_name != 'workflow_dispatch' && vars.CLOUD_RUN_SERVICE_USW != '')
        env:
          DEPLOY_CELL: usw2
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USW }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ env.PROXY_REVISION }}
          PROXY_ALLOWED_ORIGINS: ${{ vars.PROXY_ALLOWED_ORIGINS_PROD }}
          PROXY_DATABASE_URL: ${{ secrets.PROXY_DATABASE_URL_USWEST }}
          PROXY_DOMAIN: ${{ vars.PROXY_DOMAIN_USW }}
          # Production opts in separately after its staging-proven migration.
          PEER_IDENTITY_HOSTS: ${{ vars.HOST2_PEER_IDENTITY_READY_USW == 'true' && 'superserve-vmd-usw2-2' || '' }}
          OTEL_ENVIRONMENT: production
          PROXY_DOMAINS: ${{ vars.PROXY_DOMAINS_USW }}
          REQUIRE_DATA_PLANE: ${{ vars.REQUIRE_DATA_PLANE_PROD }}
          # Outbound routing does not require this host to accept peer ingress.
          PEER_PROXY_LISTEN_ADDR: ${{ (vars.PEER_INGRESS_ENABLED_USW == '1' || (github.event_name == 'workflow_dispatch' && inputs.target == 'standby')) && 'auto' || '' }}
          PEER_PROXY_TARGET_ADDR: "127.0.0.1:5010"
          PEER_PROXY_CERT_FILE: "/etc/superserve/peer/tls.crt"
          PEER_PROXY_KEY_FILE: "/etc/superserve/peer/tls.key"
          PEER_PROXY_CA_FILE: "/etc/superserve/peer/ca.crt"
          PEER_ROUTING_ENABLED: ${{ vars.PEER_ROUTING_ENABLED_USW }}
          PEER_PROXY_MAX_STREAMS: ${{ vars.PEER_PROXY_MAX_STREAMS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ "$DEPLOY_EVENT" = workflow_dispatch ] && [ "$DEPLOY_TARGET" = standby ]; then
            source .github/workflows/scripts/select-deploy-target.sh
          elif [ "$DEPLOY_TARGET" != serving ] && [ "$DEPLOY_EVENT" = workflow_dispatch ]; then
            echo 'Invalid deploy target' >&2
            exit 1
          fi
          : "${GCP_REGION:?Refusing an unscoped proxy deployment}"
          SANDBOX_ACCESS_TOKEN_SEED=$(gcloud secrets versions access latest \
            --secret=sandbox-access-token-seed --project "$GCP_PROJECT")
          export SANDBOX_ACCESS_TOKEN_SEED
          python3 .github/workflows/scripts/deploy-proxy.py
