name: Test Saved Snapshots Staging

on:
  workflow_dispatch:

jobs:
  canary:
    name: Saved snapshot canary
    if: github.ref == 'refs/heads/mohamedsobhi777/snapshot-staging-test-20260728'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Run saved-snapshot functional canary
        env:
          RUN_SNAPSHOT_CANARY: '1'
          API_BASE_URL: https://api-staging.superserve.ai
          SANDBOX_BASE_URL: https://staging-sandbox.superserve.ai
          API_KEY: ${{ secrets.STAGING_INTERNAL_API_TOKEN }}
          REQUIRE_SNAPSHOT_RESTART_HOOK: '0'
          SNAPSHOT_SHADOW_DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SNAPSHOT_TEAM_ID: ${{ secrets.SYSTEM_TEAM_ID_STAGING }}
        run: ./scripts/smoke-test-snapshots.sh
