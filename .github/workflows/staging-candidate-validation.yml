name: Staging candidate validation

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed manifest name in deploy/staging-candidates
        required: true
        type: string
        default: yc-credit-recovery
      mode:
        description: Preflight is read-only; apply migrates and deploys staging
        required: true
        type: choice
        options: [preflight, apply]
      preflight_run_id:
        description: Successful preflight run on this exact main revision (apply only)
        type: string
      approved_receipt_sha256:
        description: Reviewed receipt hash from that preflight summary (apply only)
        type: string
      accept_concurrent_staging:
        description: Accept the inventoried cohort and normal concurrent staging financial processing (apply only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: control-plane-deploy
  queue: max
  cancel-in-progress: false

env:
  CANDIDATE: ${{ inputs.candidate }}
  VALIDATION_MODE: ${{ inputs.mode }}
  PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
  APPROVED_RECEIPT_SHA256: ${{ inputs.approved_receipt_sha256 }}
  ACCEPT_CONCURRENT_STAGING: ${{ inputs.accept_concurrent_staging && 'true' || 'false' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      candidate_revision: ${{ steps.gate.outputs.candidate_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gate
        run: python3 .github/workflows/scripts/staging_candidate_validation.py gate
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build candidate
    needs: gate
    if: inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_revision }}
          persist-credentials: false
      - name: Build without cloud credentials
        env:
          CANDIDATE_REVISION: ${{ needs.gate.outputs.candidate_revision }}
        run: |
          docker build --platform linux/amd64 -t "controlplane:$CANDIDATE_REVISION" .
          docker save "controlplane:$CANDIDATE_REVISION" > /tmp/controlplane.tar
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image
          path: /tmp/controlplane.tar
          retention-days: 7
          if-no-files-found: error

  staging:
    name: Staging validation
    needs: [gate, build]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.build.result == 'success' || (inputs.mode == 'apply' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: database-migrations
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reverify before obtaining cloud credentials
        run: python3 .github/workflows/scripts/staging_candidate_validation.py gate
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_revision }}
          path: candidate-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-image
          path: image
          github-token: ${{ github.token }}
          run-id: ${{ inputs.mode == 'apply' && inputs.preflight_run_id || github.run_id }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.119.0'
      - run: python3 -m pip install -r scripts/migration-requirements.txt
      - run: python3 -m pip install -r deploy/staging-candidates/requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run staging validation
        run: python3 .github/workflows/scripts/staging_candidate_validation.py "$VALIDATION_MODE"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'preflight'
        with:
          name: staging-preflight
          path: receipt/receipt.json
          retention-days: 7
          if-no-files-found: error
