name: Terraform Rollout Staging

concurrency:
  group: terraform-staging-us-central1
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type apply to apply staging Terraform and run smoke validation'
        required: true
        type: string
      allow_non_main:
        description: 'Allow an explicitly selected feature branch to update staging'
        required: false
        default: false
        type: boolean
      snapshot_storage_only:
        description: 'Target only the saved-snapshot data disk and attachment'
        required: false
        default: false
        type: boolean
      saved_snapshot_canary:
        description: 'Run the saved-snapshot functional canary after regional smoke'
        required: false
        default: false
        type: boolean

jobs:
  staging:
    name: Apply staging us-central1
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || inputs.allow_non_main
    environment: staging
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TF_IN_AUTOMATION: 'true'
      API_BASE_URL: https://api-staging.superserve.ai
      API_KEY: ${{ secrets.STAGING_INTERNAL_API_TOKEN }}
      SANDBOX_BASE_URL: https://staging-sandbox.superserve.ai
    steps:
      - name: Confirm rollout
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "apply" ]]; then
            echo "Refusing to run. Re-run with confirm=apply."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -v -short -count=1 -race ./...

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sandbox_test?sslmode=disable
        run: go test -v -tags integration -count=1 -race -timeout 10m ./internal/integration/ ./cmd/migrate-team/

      - name: Build all binaries
        run: |
          go build -ldflags "-s -w" -o /dev/null ./cmd/controlplane
          go build -ldflags "-s -w" -o /dev/null ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o /dev/null ./cmd/boxd

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'

      - name: Verify sqlc generated code is up to date
        run: |
          sqlc generate
          git diff --quiet --exit-code

      - name: Verify migration order
        run: |
          git fetch origin main
          highest_main=$(git ls-tree -r origin/main --name-only \
            | grep '^supabase/migrations/' \
            | grep -oE '[0-9]{14}' \
            | sort -n | tail -n1)
          new_migration=$(git diff --name-only --diff-filter=A origin/main...HEAD \
            -- supabase/migrations/ \
            | grep -oE '[0-9]{14}' \
            | sort -n | head -n1)
          test -n "$new_migration"
          test "$new_migration" -gt "$highest_main"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify validation dependencies
        run: |
          set -euo pipefail
          command -v jq
          command -v curl

      - name: Terraform apply staging/us-central1
        env:
          SNAPSHOT_STORAGE_ONLY: ${{ inputs.snapshot_storage_only }}
        run: |
          set -euo pipefail
          echo "## Terraform rollout: staging/us-central1" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/staging/us-central1
          terraform init -input=false
          terraform validate
          target_args=()
          if [[ "$SNAPSHOT_STORAGE_ONLY" == "true" ]]; then
            target_args+=(
              -target=google_compute_disk.sandbox_data
              -target=google_compute_attached_disk.sandbox_data
            )
            echo "Targeted rollout: saved-snapshot storage only." >> "$GITHUB_STEP_SUMMARY"
          fi
          terraform plan -input=false -out=tfplan "${target_args[@]}"
          terraform show -json tfplan > tfplan.json
          destructive=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' tfplan.json)
          if [[ "$destructive" != "0" ]]; then
            echo "::error::Refusing a staging plan with $destructive delete/replace action(s)."
            jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address): \(.change.actions | join(","))"' tfplan.json
            exit 1
          fi
          terraform apply -input=false -auto-approve tfplan

      - name: Smoke test staging/us-central1
        run: |
          set -euo pipefail
          scripts/smoke-test-region.sh staging us-central1
          echo "staging/us-central1 apply and smoke validation passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Run saved-snapshot functional canary
        if: inputs.saved_snapshot_canary
        env:
          RUN_SNAPSHOT_CANARY: '1'
          REQUIRE_SNAPSHOT_RESTART_HOOK: '0'
          SNAPSHOT_SHADOW_DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SNAPSHOT_TEAM_ID: ${{ secrets.SYSTEM_TEAM_ID_STAGING }}
        run: ./scripts/smoke-test-snapshots.sh
