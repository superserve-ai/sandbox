name: Terraform CD

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-cd.yml'

jobs:
  wait-for-migrations:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for same-SHA CD Migrate to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          MIGRATIONS_CHANGED=unknown
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] &&
             git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            if git diff --name-only "$BEFORE" HEAD | grep -q '^supabase/migrations/'; then
              MIGRATIONS_CHANGED=yes
            else
              MIGRATIONS_CHANGED=no
            fi
          fi

          if [ "$MIGRATIONS_CHANGED" = "no" ]; then
            echo "No migration changes in ${BEFORE}..${{ github.sha }}; skipping gate."
            exit 0
          fi

          echo "migrations_changed=$MIGRATIONS_CHANGED — checking CD Migrate for ${{ github.sha }}"
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/cd.yml/runs?head_sha=${{ github.sha }}&event=push" \
              --jq '.workflow_runs[0] | if . == null then "absent absent" else "\(.status) \(.conclusion // "pending")" end')
            status=${run% *}; conclusion=${run#* }
            echo "attempt $i: status=$status conclusion=$conclusion"
            if [ "$status" = "absent" ] && [ "$MIGRATIONS_CHANGED" = "unknown" ] && [ "$i" -ge 6 ]; then
              echo "No CD Migrate run appeared in ~2 min — push touched no migrations; proceeding."
              exit 0
            fi
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CD Migrate succeeded; proceeding."
                exit 0
              fi
              echo "CD Migrate concluded '$conclusion' — refusing rollout against an unmigrated schema."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for CD Migrate; refusing rollout."
          exit 1

  build-api-image:
    name: Build API image once
    runs-on: ubuntu-latest
    needs: [wait-for-migrations]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build controlplane image
        run: |
          docker build --platform linux/amd64 -t controlplane:${{ github.sha }} .
          docker save controlplane:${{ github.sha }} | gzip > /tmp/controlplane-image.tar.gz

      - name: Upload controlplane image artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp/controlplane-image.tar.gz
          if-no-files-found: error

  staging-us-central1-infra:
    name: Apply staging/us-central1
    runs-on: ubuntu-latest
    needs: [wait-for-migrations]
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify validation dependencies
        run: |
          set -euo pipefail
          command -v jq
          command -v curl

      - name: Terraform apply staging/us-central1
        run: |
          set -euo pipefail
          echo "## Terraform rollout: staging/us-central1" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/staging/us-central1
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

  staging-us-central1-api:
    name: Deploy API staging/us-central1
    runs-on: ubuntu-latest
    environment: staging
    needs: [build-api-image, staging-us-central1-infra]
    permissions:
      contents: read
      id-token: write
    env:
      API_BASE_URL: https://api-staging.superserve.ai
      API_KEY: ${{ secrets.STAGING_INTERNAL_API_TOKEN }}
      SANDBOX_BASE_URL: https://staging-sandbox.superserve.ai
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT }}

      - name: Route traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      - name: Verify latest revision serves traffic
        run: |
          set -euo pipefail
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
          curl -sf "$(echo "$DESC" | jq -r '.status.url')/health" >/dev/null

      - name: Smoke test staging/us-central1
        run: |
          set -euo pipefail
          scripts/smoke-test-region.sh staging us-central1
          echo "staging/us-central1 API deploy and smoke validation passed." >> "$GITHUB_STEP_SUMMARY"

  production-us-west2-infra:
    name: Apply production/us-west2
    runs-on: ubuntu-latest
    environment: production
    needs: [staging-us-central1-api]
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify validation dependencies
        run: |
          set -euo pipefail
          command -v jq
          command -v curl

      - name: Terraform apply production/us-west2
        run: |
          set -euo pipefail
          echo "## Terraform rollout: production/us-west2" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/production/us-west2
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

  production-us-west2-api:
    name: Deploy API production/us-west2
    runs-on: ubuntu-latest
    environment: production
    needs: [build-api-image, production-us-west2-infra]
    permissions:
      contents: read
      id-token: write
    env:
      API_BASE_URL: https://api-usw.superserve.ai
      API_KEY: ${{ secrets.PROD_USW_INTERNAL_API_TOKEN }}
      SANDBOX_BASE_URL: https://usw-sandbox.superserve.ai
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE_USW }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION_USW }} \
            --project ${{ vars.GCP_PROJECT }}

      - name: Route traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USW }}
          ARGS="--region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      - name: Verify latest revision serves traffic
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USW }}
          ARGS="--region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi

      - name: Smoke test production/us-west2
        run: |
          set -euo pipefail
          scripts/smoke-test-region.sh production us-west2
          echo "production/us-west2 deploy and smoke validation passed." >> "$GITHUB_STEP_SUMMARY"

  production-us-central1-infra:
    name: Apply production/us-central1
    runs-on: ubuntu-latest
    environment: production
    needs: [production-us-west2-api]
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify validation dependencies
        run: |
          set -euo pipefail
          command -v jq
          command -v curl

      - name: Terraform apply production/us-central1
        run: |
          set -euo pipefail
          echo "## Terraform rollout: production/us-central1" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/production/us-central1
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

  # us-east4 is the "use" cell's control plane + vmd host (api.superserve.ai) —
  # the production primary. Applies infrastructure; the api deploy/traffic/smoke
  # then runs in production-us-east4-api below. That api job replaces the retired
  # us-central1 api deploy, so infra-inclusive pushes (which skip Deploy API via
  # its infra_changed guard) still roll the primary to the new image.
  #
  # Branches off staging directly (NOT off the us-west2/us-central1 chain) so a
  # secondary-region deploy/traffic/smoke failure can never block the primary's
  # rollout. us-east4 only reads the shared api-runner SA (a data source) and
  # re-declares no us-central1-owned resource, so it needs no apply ordering
  # against that cell.
  production-us-east4-infra:
    name: Apply production/us-east4
    runs-on: ubuntu-latest
    environment: production
    needs: [staging-us-central1-api]
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform apply production/us-east4
        run: |
          set -euo pipefail
          echo "## Terraform rollout: production/us-east4" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/production/us-east4
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

  production-us-east4-api:
    name: Deploy API production/us-east4
    runs-on: ubuntu-latest
    environment: production
    needs: [build-api-image, production-us-east4-infra]
    permissions:
      contents: read
      id-token: write
    env:
      API_BASE_URL: https://api.superserve.ai
      API_KEY: ${{ secrets.PROD_INTERNAL_API_TOKEN }}
      SANDBOX_BASE_URL: https://sandbox.superserve.ai
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE_USE4 }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION_USE4 }} \
            --project ${{ vars.GCP_PROJECT }}

      - name: Route traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USE4 }}
          ARGS="--region ${{ vars.GCP_REGION_USE4 }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      - name: Verify latest revision serves traffic
        run: |
          set -euo pipefail
          SVC=${{ vars.CLOUD_RUN_SERVICE_USE4 }}
          ARGS="--region ${{ vars.GCP_REGION_USE4 }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
          curl -sf "$(echo "$DESC" | jq -r '.status.url')/health" >/dev/null

      - name: Smoke test production/us-east4
        run: |
          set -euo pipefail
          scripts/smoke-test-region.sh production us-east4
          echo "production/us-east4 deploy and smoke validation passed." >> "$GITHUB_STEP_SUMMARY"
