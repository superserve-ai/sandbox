name: Terraform Rollout Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type apply to apply production Terraform and run smoke validation'
        required: true
        type: string
      target:
        description: 'Production target to apply'
        required: true
        type: choice
        options:
          - west2
          - central1
          - all

jobs:
  west2:
    name: Apply production us-west2
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' && (inputs.target == 'west2' || inputs.target == 'all') && needs.central1.result == 'success' }}
    needs: [central1]
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
      API_BASE_URL: https://usw-api.superserve.ai
      API_KEY: ${{ secrets.SS_TEST_API_KEY_USW }}
      SANDBOX_BASE_URL: https://usw-sandbox.superserve.ai
    steps:
      - name: Confirm rollout
        run: |
          if [[ "${{ inputs.confirm }}" != "apply" ]]; then
            echo "Refusing to run. Re-run with confirm=apply."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify production runtime KMS grant
        run: bash infra/scripts/verify-production-runtime-kms.sh

      - name: Verify validation dependencies
        run: |
          set -euo pipefail
          command -v jq
          command -v curl

      - name: Terraform apply production/us-west2
        run: |
          set -euo pipefail
          echo "## Terraform rollout: production/us-west2" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/production/us-west2
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Smoke test production/us-west2
        run: |
          set -euo pipefail
          scripts/smoke-test-region.sh production us-west2
          echo "production/us-west2 apply and smoke validation passed." >> "$GITHUB_STEP_SUMMARY"

  central1:
    name: Apply production us-central1
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'central1' || inputs.target == 'all' || inputs.target == 'west2') }}
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
      API_BASE_URL: https://usc-api.superserve.ai
      API_KEY: ${{ secrets.SS_TEST_API_KEY_USEAST }}
      SANDBOX_BASE_URL: https://usc-sandbox.superserve.ai
    steps:
      - name: Confirm rollout
        run: |
          if [[ "${{ inputs.confirm }}" != "apply" ]]; then
            echo "Refusing to run. Re-run with confirm=apply."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify validation dependencies
        run: |
          set -euo pipefail
          command -v jq
          command -v curl

      - name: Terraform apply production/us-central1
        run: |
          set -euo pipefail
          echo "## Terraform rollout: production/us-central1" >> "$GITHUB_STEP_SUMMARY"
          cd infra/envs/production/us-central1
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
