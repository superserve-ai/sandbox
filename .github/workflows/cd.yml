name: CD — Migrate

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Read-only connection preflight, or separately approved migrations'
        required: true
        type: choice
        default: preflight
        options: [preflight, migrate, recovery-preflight, recover]
      approved_revision:
        description: 'Exact approved main commit SHA'
        required: true
        type: string
      environment:
        description: 'Target environment (staging always runs first)'
        required: true
        type: choice
        default: staging
        options: [staging, production]
      preflight_run_id:
        description: 'Migrate only: successful same-revision preflight covering every target'
        required: false
        type: string
      recovery_evidence_run_id:
        description: 'Production recovery: fresh authenticated read-only collector run'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/shared-auth-history/**'
      - 'scripts/migrate_database.py'
      - 'scripts/retained_storage_recovery.py'
      - 'scripts/recovery_evidence.py'
      - 'scripts/migration-requirements.txt'
      - 'supabase/recovery/**'
      - '.github/workflows/recovery-evidence.yml'
      - 'scripts/test_migration_*.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/scripts/migration_gate.py'
      - '.github/workflows/scripts/test_migration_gate.py'
      - '.github/workflows/scripts/wait-for-push-ci.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  gate:
    name: Verify migration release
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.gate.outputs.action }}
      production: ${{ steps.gate.outputs.production }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: python3 .github/workflows/scripts/migration_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_REVISION: ${{ inputs.approved_revision }}
          MIGRATION_ACTION: ${{ inputs.action }}
          MIGRATION_ENVIRONMENT: ${{ inputs.environment }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RECOVERY_EVIDENCE_RUN_ID: ${{ inputs.recovery_evidence_run_id }}

  migrate-staging:
    name: ${{ needs.gate.outputs.action == 'recovery-preflight' && 'Recovery Preflight Staging' || needs.gate.outputs.action == 'recover' && 'Recover Staging' || needs.gate.outputs.action == 'preflight' && 'Preflight Staging' || 'Migrate Staging' }}
    needs: [gate]
    runs-on: ubuntu-latest
    environment: staging
    env:
      RECOVERY_RECEIPT_DIR: ${{ github.workspace }}/recovery-receipts
      RECOVERY_EVIDENCE_RUN_ID: ${{ inputs.recovery_evidence_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.119.0'
      - run: python3 -m pip install -r scripts/migration-requirements.txt
      - uses: actions/download-artifact@v4
        if: needs.gate.outputs.action == 'recover'
        with:
          name: recovery-preflight-staging
          path: ${{ env.RECOVERY_RECEIPT_DIR }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}
      - name: Run approved staging action
        run: |
          python3 .github/workflows/scripts/migration_gate.py --verify-revision
          python3 scripts/migrate_database.py staging "$MIGRATION_ACTION"
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_ACTION: ${{ needs.gate.outputs.action }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.action == 'recovery-preflight'
        with:
          name: recovery-preflight-staging
          path: ${{ env.RECOVERY_RECEIPT_DIR }}/*.json
          if-no-files-found: error
          retention-days: 1

  migrate-prod:
    name: ${{ needs.gate.outputs.action == 'recovery-preflight' && 'Recovery Preflight Production' || needs.gate.outputs.action == 'recover' && 'Recover Production' || needs.gate.outputs.action == 'preflight' && 'Preflight Production' || 'Migrate Production' }}
    if: needs.gate.outputs.production == 'true'
    needs: [gate, migrate-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RECOVERY_RECEIPT_DIR: ${{ github.workspace }}/recovery-receipts
      RECOVERY_EVIDENCE_RUN_ID: ${{ inputs.recovery_evidence_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.119.0'
      - run: python3 -m pip install -r scripts/migration-requirements.txt
      - uses: actions/download-artifact@v4
        if: needs.gate.outputs.action == 'recover'
        with:
          name: recovery-preflight-production
          path: ${{ env.RECOVERY_RECEIPT_DIR }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}
      - uses: google-github-actions/auth@v2
        if: needs.gate.outputs.action == 'recovery-preflight' || needs.gate.outputs.action == 'recover'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: needs.gate.outputs.action == 'recovery-preflight' || needs.gate.outputs.action == 'recover'
      - name: Run approved primary production action
        run: |
          python3 .github/workflows/scripts/migration_gate.py --verify-revision
          python3 scripts/migrate_database.py use4 "$MIGRATION_ACTION"
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_ACTION: ${{ needs.gate.outputs.action }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      - name: Run approved west production action
        run: |
          python3 .github/workflows/scripts/migration_gate.py --verify-revision
          python3 scripts/migrate_database.py usw2 "$MIGRATION_ACTION"
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_ACTION: ${{ needs.gate.outputs.action }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_USWEST }}
      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.action == 'recovery-preflight'
        with:
          name: recovery-preflight-production
          path: ${{ env.RECOVERY_RECEIPT_DIR }}/*.json
          if-no-files-found: error
          retention-days: 1
