# CD — Migrate — Supabase schema migrations.
#
# Triggers:
#   - push to main on supabase/migrations/**: runs staging, then production
#   - workflow_dispatch with environment=staging: staging only
#   - workflow_dispatch with environment=production: staging FIRST, then production
#
# Production NEVER migrates without staging first. Running prod migrations
# while staging is behind is a recipe for schema drift and rollback pain.

name: CD — Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to staging
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      # Staging is a shared playground: snapshots should work for every team
      # without a manual feature-flag or quota provisioning step. Keep this
      # environment policy outside the shared migrations so production remains
      # gated until its rollout is explicitly approved.
      - name: Enable snapshots for the staging playground
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          psql --dbname="$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '10s';
          SET LOCAL statement_timeout = '2min';

          INSERT INTO feature_flag (key, enabled, description)
          VALUES (
              'sandbox_snapshots_v1',
              true,
              'Allow a team to capture immutable saved snapshots and create sandboxes from them.'
          )
          ON CONFLICT (key) DO UPDATE
          SET enabled = EXCLUDED.enabled,
              updated_at = now();

          -- Per-team values override the global flag, so staging should rely
          -- solely on the globally enabled playground default.
          DELETE FROM team_feature_flag
          WHERE key = 'sandbox_snapshots_v1';

          -- 100 GiB is intentionally generous for staging. Preserve any
          -- larger quota that an existing staging team already has.
          ALTER TABLE team
              ALTER COLUMN snapshot_storage_quota_bytes
              SET DEFAULT 107374182400;

          UPDATE team
          SET snapshot_storage_quota_bytes = 107374182400,
              updated_at = now()
          WHERE snapshot_storage_quota_bytes IS NULL
             OR snapshot_storage_quota_bytes < 107374182400;

          COMMIT;
          SQL

  migrate-prod:
    name: Migrate Production
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    needs: [migrate-staging]
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      # Every cell DB runs the identical migration set; a cell that misses a
      # migration silently drifts until a deploy 500s against it. A step in
      # this job — not a separate job — so a protected production environment
      # gates ONE approval (a second env-referencing job would double-gate
      # Deploy API, which waits on this whole workflow). Step order still
      # stops a bad migration at the primary before it spreads.
      - name: Push migrations to usw cell
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_USWEST }}
