# CD — Migrate — Supabase schema migrations.
#
# Triggers:
#   - push to main on supabase/migrations/**: runs staging, then production
#   - workflow_dispatch with environment=staging: staging only
#   - workflow_dispatch with environment=production: staging FIRST, then production
#
# Production NEVER migrates without staging first. Running prod migrations
# while staging is behind is a recipe for schema drift and rollback pain.

name: CD — Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: cd-migrate
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      # These hot-table indexes must be built one at a time outside the
      # transactional Supabase migration. The script also verifies their exact
      # table, btree, uniqueness, key, predicate, and catalog state contract.
      - name: Prebuild and verify saved-snapshot indexes in staging
        run: >-
          psql
          --dbname="$DATABASE_URL"
          --no-psqlrc
          --file=scripts/prebuild-saved-snapshot-indexes.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Push migrations to staging
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

  migrate-prod:
    name: Migrate Production
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    needs: [migrate-staging]
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      # Prebuild and verify both production cells before either cell crosses
      # the contract migration. A failure leaves both databases on the
      # leave-forward expand schema with the feature dark.
      - name: Prebuild and verify saved-snapshot indexes in production primary
        run: >-
          psql
          --dbname="$DATABASE_URL"
          --no-psqlrc
          --file=scripts/prebuild-saved-snapshot-indexes.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Prebuild and verify saved-snapshot indexes in production usw
        run: >-
          psql
          --dbname="$DATABASE_URL"
          --no-psqlrc
          --file=scripts/prebuild-saved-snapshot-indexes.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_USWEST }}

      - name: Push migrations to production primary
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      # Every cell DB runs the identical migration set; a cell that misses a
      # migration silently drifts until a deploy 500s against it. A step in
      # this job — not a separate job — so a protected production environment
      # gates ONE approval (a second env-referencing job would double-gate
      # Deploy API, which waits on this whole workflow). Step order still
      # stops a bad migration at the primary before it spreads.
      - name: Push migrations to usw cell
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_USWEST }}
