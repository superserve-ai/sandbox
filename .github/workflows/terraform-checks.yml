name: Terraform Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: terraform-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: Terraform Fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Terraform roots
        run: scripts/terraform-validate.sh

  terraform-plan-summary:
    name: Terraform Plan Summary
    runs-on: ubuntu-latest
    needs: [terraform-fmt, terraform-validate]
    if: always()
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Propagate prerequisite failures
        if: ${{ needs.terraform-fmt.result != 'success' || needs.terraform-validate.result != 'success' }}
        run: exit 1

      - name: Wait for Terraform Plans
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          changed_files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --paginate --jq '.[].filename')
          terraform_change=false
          while IFS= read -r path; do
            case "$path" in
              infra/*|infra/scripts/*|scripts/terraform-*.sh|.github/workflows/terraform-*.yml)
                terraform_change=true
                break
                ;;
            esac
          done <<< "$changed_files"

          # Forked Terraform PRs are not supported by the credentialed plan gate.
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] && [ "$terraform_change" = true ]; then
            echo "::error title=Terraform plan unavailable::Terraform PRs from forks are not supported by the plan gate."
            exit 1
          fi

          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/terraform-plans.yml/runs?head_sha=${{ github.event.pull_request.head.sha }}&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "absent absent" else "\(.status) \(.conclusion // "pending")" end')
            status=${run% *}
            conclusion=${run#* }

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "::error title=Terraform plan failed::Terraform Plans concluded '$conclusion'."
              exit 1
            fi

            if [ "$status" = "absent" ] && [ "$i" -ge 6 ]; then
              if [ "$terraform_change" = true ]; then
                echo "::error title=Terraform plan workflow missing::This PR changes Terraform-related files, but no Terraform Plans workflow run appeared."
                exit 1
              fi
              echo "No Terraform plan workflow run appeared for this non-Terraform PR."
              exit 0
            fi

            sleep 20
          done

          echo "::error title=Terraform plan check timed out::Terraform Plans did not complete in time."
          exit 1
