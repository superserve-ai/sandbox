name: Terraform Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: terraform-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      plan: ${{ steps.changes.outputs.plan }}
    steps:
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            plan:
              - "infra/**"
              - "scripts/terraform-*.sh"
              - "scripts/provision-host.py"
              - "deploy/host-provisioning-hold.sh"
              - "deploy/release-host-provisioning.sh"
              - ".github/workflows/host-provision.yml"
              - ".github/workflows/scripts/test_terraform_boot_image.py"
              - "scripts/sanitize-terraform-plan.sh"
              - ".github/workflows/terraform-*.yml"

  terraform-fmt:
    name: Terraform Fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.9'
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.9'
          terraform_wrapper: false

      - name: Test control-plane identity rollout
        run: python3 -m unittest discover -s scripts -p 'test*control_plane*.py'

      - name: Test managed host logging configuration
        run: python3 -m unittest scripts.test_host_logging_config scripts.test_host_logging_plan scripts.test_host_logging_legacy_migration

      - name: Validate Terraform roots
        run: scripts/terraform-validate.sh

      - name: Test identity rollout evidence bootstrap
        run: terraform -chdir=infra/bootstrap/control-plane-evidence test

      - name: Test peer CA custody and IAM with mocked providers
        run: |
          terraform -chdir=infra/modules/peer-ca init -backend=false -lockfile=readonly -input=false
          terraform -chdir=infra/modules/peer-ca test

      - name: Test sandbox host with mocked provider
        run: |
          terraform -chdir=infra/modules/sandbox-host init -backend=false -input=false
          terraform -chdir=infra/modules/sandbox-host test

      - name: Test creation-time managed identity host with mocked provider
        run: |
          terraform -chdir=infra/modules/managed-identity-host init -backend=false -input=false
          terraform -chdir=infra/modules/managed-identity-host test

      - name: Test alert selection across generated host identities
        run: |
          terraform -chdir=infra/modules/observability init -backend=false -input=false
          terraform -chdir=infra/modules/observability test

      - name: Test managed host logging policy
        run: |
          terraform -chdir=infra/modules/host-logging init -backend=false -input=false
          terraform -chdir=infra/modules/host-logging test

      - name: Test alert runbook URL construction
        run: |
          terraform -chdir=infra/modules/alert-runbooks init -backend=false -input=false
          terraform -chdir=infra/modules/alert-runbooks test

      - name: Test proxy generation IAM and ownership
        run: |
          terraform -chdir=infra/modules/proxy-lb init -backend=false -input=false
          terraform -chdir=infra/modules/proxy-lb test

      - name: Test Cloud IDS triage alerts with mocked provider
        run: |
          terraform -chdir=infra/modules/cloud-ids init -backend=false -input=false
          terraform -chdir=infra/modules/cloud-ids test

  terraform-plan:
    name: terraform-plan (${{ matrix.name }})
    needs: [terraform-changes]
    if: needs.terraform-changes.outputs.plan == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staging-us-central1
            dir: infra/envs/staging/us-central1
            environment: staging
          - name: production-us-central1
            dir: infra/envs/production/us-central1
            environment: production
          - name: production-us-west2
            dir: infra/envs/production/us-west2
            environment: production
          - name: production-us-east4
            dir: infra/envs/production/us-east4
            environment: production
    environment: ${{ matrix.environment }}
    env:
      TF_VAR_compute_restrictions_secret_name: ${{ secrets.COMPUTE_RESTRICTIONS_SECRET_NAME }}
      TF_IN_AUTOMATION: "true"
      HAS_GCP_AUTH: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
      # Existing Monitoring channel resource names are non-secret references;
      # the channel's Slack credential remains owned by Cloud Monitoring.
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
      TF_VAR_cloud_ids_runbook_base_url: ${{ vars.RUNBOOK_BASE_URL }}
      TF_VAR_alert_runbook_base_url: ${{ vars.RUNBOOK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.9'
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_AUTH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Skip plan when GCP auth is unavailable
        if: env.HAS_GCP_AUTH != 'true'
        run: |
          summary_file="${GITHUB_WORKSPACE}/terraform-plan-summary-${{ matrix.name }}.txt"
          echo "::notice title=Terraform plan skipped::GCP auth secrets are not configured."
          echo "Terraform plan skipped because GCP auth secrets are not configured for this workflow." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Terraform plan: ${{ matrix.name }}"
            echo
            echo "Skipped because GCP auth secrets are not configured."
          } > "$summary_file"

      - name: Set PR runbook base URL
        if: env.HAS_GCP_AUTH == 'true'
        shell: bash
        run: |
          # PR plans are never applied; allow them before private destinations exist.
          if [[ -z "${TF_VAR_alert_runbook_base_url:-}" ]]; then
            echo 'TF_VAR_alert_runbook_base_url=https://example.com/runbooks' >> "$GITHUB_ENV"
          fi

      - name: Plan
        if: env.HAS_GCP_AUTH == 'true'
        shell: bash
        run: |
          set -euo pipefail

          summary_file="${GITHUB_WORKSPACE}/terraform-plan-summary-${{ matrix.name }}.txt"
          {
            echo "## Terraform plan: ${{ matrix.name }}"
            echo
          } > "$summary_file"

          if [[ "${{ matrix.name }}" == production-* ]]; then
            channel_ids="${TF_VAR_notification_channel_ids:-}"
            case "$channel_ids" in
              ""|"[]")
                echo "::error title=Missing notification channels::Set the existing monitored channel resource names in the TF_VAR_NOTIFICATION_CHANNEL_IDS repository/environment variable."
                echo "Plan stopped: monitored notification channels are required for production." >> "$summary_file"
                exit 1
                ;;
              \[*\])
                if [[ ! "$channel_ids" =~ ^\[[[:space:]]*\"projects/[a-z][a-z0-9-]*/notificationChannels/[0-9]+\"([[:space:]]*,[[:space:]]*\"projects/[a-z][a-z0-9-]*/notificationChannels/[0-9]+\")*[[:space:]]*\]$ ]]; then
                  echo "::error title=Invalid notification channels::TF_VAR_NOTIFICATION_CHANNEL_IDS contains an invalid channel resource name."
                  echo "Plan stopped: notification channels must use projects/PROJECT_ID/notificationChannels/NUMERIC_ID." >> "$summary_file"
                  exit 1
                fi
                ;;
              projects/*/notificationChannels/*)
                if [[ ! "$channel_ids" =~ ^projects/[a-z][a-z0-9-]*/notificationChannels/[0-9]+$ ]]; then
                  echo "::error title=Invalid notification channels::TF_VAR_NOTIFICATION_CHANNEL_IDS must name a valid Cloud Monitoring channel."
                  echo "Plan stopped: notification channels must use projects/PROJECT_ID/notificationChannels/NUMERIC_ID." >> "$summary_file"
                  exit 1
                fi
                export TF_VAR_notification_channel_ids="[\"$channel_ids\"]"
                ;;
              *)
                echo "::error title=Invalid notification channels::TF_VAR_NOTIFICATION_CHANNEL_IDS must be a Terraform list literal."
                echo "Plan stopped: TF_VAR_NOTIFICATION_CHANNEL_IDS is not a Terraform list literal." >> "$summary_file"
                exit 1
                ;;
            esac
          fi

          cd "${{ matrix.dir }}"

          terraform init -input=false

          set +e
          terraform plan -input=false -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan
          plan_status=$?
          set -e

          if [[ $plan_status -eq 0 ]]; then
            echo "No changes."
            echo "No changes." >> "$summary_file"
            exit 0
          fi

          if [[ $plan_status -eq 2 ]]; then
            echo "Changes detected."
            echo "Changes detected." >> "$summary_file"
            echo >> "$summary_file"
            echo "Sanitized plan summary:" >> "$summary_file"
            echo '```' >> "$summary_file"
            "${GITHUB_WORKSPACE}/scripts/sanitize-terraform-plan.sh" tfplan >> "$summary_file"
            echo '```' >> "$summary_file"
            exit 0
          fi

          echo "::error title=Terraform plan failed::${{ matrix.name }} terraform plan failed."
          {
            echo "Terraform plan failed."
            echo
            echo "See the job logs for details."
          } > "$summary_file"
          exit "$plan_status"

      - name: Upload Terraform plan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-summary-${{ matrix.name }}
          path: terraform-plan-summary-${{ matrix.name }}.txt
          if-no-files-found: error

  terraform-plan-summary:
    name: Terraform Plan Summary
    runs-on: ubuntu-latest
    needs: [terraform-changes, terraform-fmt, terraform-validate, terraform-plan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Download plan summaries
        if: needs.terraform-plan.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: terraform-plan-summary-*
          path: terraform-plan-summaries

      - name: Publish consolidated summary
        if: needs.terraform-plan.result != 'skipped'
        shell: bash
        run: |
          set -euo pipefail

          echo "## Terraform Plan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          mapfile -t summaries < <(find terraform-plan-summaries -type f -name 'terraform-plan-summary-*.txt' | sort)

          if [[ ${#summaries[@]} -eq 0 ]]; then
            echo "No Terraform plan summaries were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for summary in "${summaries[@]}"; do
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Propagate check failures
        if: >-
          needs.terraform-changes.result != 'success' ||
          needs.terraform-fmt.result != 'success' ||
          needs.terraform-validate.result != 'success' ||
          (needs.terraform-changes.outputs.plan == 'true' && needs.terraform-plan.result != 'success') ||
          (needs.terraform-plan.result != 'success' && needs.terraform-plan.result != 'skipped')
        run: exit 1
