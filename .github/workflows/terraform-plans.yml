name: Terraform Plans
run-name: >-
  Terraform Plans PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "infra/scripts/*.sh"
      - "scripts/terraform-*.sh"
      - ".github/workflows/terraform-*.yml"

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: terraform-plan (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staging-us-central1
            dir: infra/envs/staging/us-central1
            environment: staging
          - name: production-us-central1
            dir: infra/envs/production/us-central1
            environment: production
          - name: production-us-west2
            dir: infra/envs/production/us-west2
            environment: production
          - name: production-us-east4
            dir: infra/envs/production/us-east4
            environment: production
    environment: ${{ matrix.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      HAS_GCP_AUTH: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
      TF_VAR_notification_channel_ids: ${{ vars.TF_VAR_NOTIFICATION_CHANNEL_IDS || '[]' }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_AUTH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Require GCP authentication
        if: env.HAS_GCP_AUTH != 'true'
        run: |
          echo "::error title=Terraform plan unavailable::Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT for the ${{ matrix.environment }} environment."
          exit 1

      - name: Validate and plan
        if: env.HAS_GCP_AUTH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary_file="${GITHUB_WORKSPACE}/terraform-plan-summary-${{ matrix.name }}.txt"
          {
            echo "## Terraform plan: ${{ matrix.name }}"
            echo
          } > "$summary_file"

          if [[ "${{ matrix.name }}" == production-* ]]; then
            channel_ids="${TF_VAR_notification_channel_ids:-}"
            case "$channel_ids" in
              ""|"[]")
                echo "::error title=Missing notification channels::Set TF_VAR_NOTIFICATION_CHANNEL_IDS."
                exit 1
                ;;
              projects/*/notificationChannels/*)
                export TF_VAR_notification_channel_ids="[\"$channel_ids\"]"
                ;;
            esac
          fi

          cd "${{ matrix.dir }}"
          terraform init -input=false
          terraform validate
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          plan_status=$?
          set -e

          if [[ $plan_status -eq 0 ]]; then
            echo "No changes." >> "$summary_file"
            exit 0
          fi
          if [[ $plan_status -eq 2 ]]; then
            echo "Changes detected." >> "$summary_file"
            echo >> "$summary_file"
            echo "Sanitized plan summary:" >> "$summary_file"
            echo '```json' >> "$summary_file"
            "${GITHUB_WORKSPACE}/infra/scripts/sanitize-terraform-plan.sh" tfplan >> "$summary_file"
            echo '```' >> "$summary_file"
            exit 0
          fi
          echo "::error title=Terraform plan failed::${{ matrix.name }} terraform plan failed."
          exit "$plan_status"

      - name: Upload Terraform plan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-summary-${{ matrix.name }}
          path: terraform-plan-summary-${{ matrix.name }}.txt
          if-no-files-found: error

  terraform-plan-summary:
    name: Terraform Plan Details
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Download plan summaries
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/download-artifact@v4
        with:
          pattern: terraform-plan-summary-*
          path: terraform-plan-summaries

      - name: Note fork validation-only runs
        if: github.event.pull_request.head.repo.fork == true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Terraform Plan Summary"
            echo
            echo "This PR is from a fork, so the credentialed Terraform plan job is skipped."
            echo "Terraform fmt and validate still run in the separate checks workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish consolidated summary
        if: github.event.pull_request.head.repo.fork != true
        shell: bash
        run: |
          set -euo pipefail
          echo "## Terraform Plan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          mapfile -t summaries < <(find terraform-plan-summaries -type f -name 'terraform-plan-summary-*.txt' | sort)
          for summary in "${summaries[@]}"; do
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Propagate plan failures
        if: ${{ github.event.pull_request.head.repo.fork != true && needs.terraform-plan.result != 'success' }}
        run: |
          echo "::error title=Terraform plan failed::One or more regional Terraform plans failed."
          exit 1
