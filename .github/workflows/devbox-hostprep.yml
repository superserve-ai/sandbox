name: Devbox Hostprep Seed

# Copies the guest kernel and base rootfs from staging's hostprep artifacts,
# which hosts are prepared from before CD injects boxd, into the devbox
# hostprep bucket. Only if those objects do not exist does it read them from a
# staging host, whose rootfs carries the boxd injected by its last deploy. The
# kernel must match its pinned digest.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Staging host to read from if the staging hostprep objects do not exist'
        required: true
        default: superserve-vmd-staging
        type: string

concurrency:
  group: devbox-hostprep
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    name: Seed hostprep artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      HOST: ${{ inputs.host }}
      SOURCE: gs://superserve-artifact-backup-staging-usc1/hostprep
      BUCKET: gs://rayai-dev-devbox-hostprep/hostprep
      KERNEL_SHA256: 3be77273fc267d2d2c239dc081cb3955f320dd0d3790de2b02690cb7f1af6761
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy and verify
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^superserve-vmd-staging(-[0-9]+)?$ ]] || { echo "::error::Not a staging host: $HOST"; exit 1; }
          work=$(mktemp -d)
          ssh_host() {
            gcloud compute ssh "$HOST" --project=rayai-dev --zone=us-central1-a \
              --tunnel-through-iap --quiet --command="set -eu; $1" -- -T
          }
          # deploy/devbox/hostprep_reader.py streams each file in one read on
          # the host, hashes exactly those bytes and reports whether the open
          # file was written meanwhile; a rename over the path is harmless.
          reader=$(base64 -w0 deploy/devbox/hostprep_reader.py)
          fetch() {
            local attempt read_line
            for attempt in 1 2 3; do
              if ssh_host "echo $reader | base64 -d | sudo python3 -I - $1" > "$work/$2" 2> "$work/$2.log"; then
                read_line=$(grep -o 'READ sha256=[0-9a-f]\{64\} size=[0-9]* stable=[01]' "$work/$2.log" | tail -1 || true)
                if [ "$read_line" = "READ sha256=$(sha256sum "$work/$2" | cut -d' ' -f1) size=$(stat -c %s "$work/$2") stable=1" ]; then
                  sha256sum "$work/$2" | cut -d' ' -f1
                  return 0
                fi
                echo "::warning::$2 attempt $attempt: host reported '${read_line:-nothing}', received $(stat -c %s "$work/$2") bytes with sha256 $(sha256sum "$work/$2" | cut -d' ' -f1)" >&2
              else
                cat "$work/$2.log" >&2
                echo "::warning::$2 attempt $attempt: copy failed" >&2
              fi
            done
            echo "::error::Could not copy a consistent $2 after 3 attempts" >&2
            return 1
          }
          listed=0
          gcloud storage ls "$SOURCE/vmlinux-4.14-fuse" "$SOURCE/base.ext4" > /dev/null 2> "$work/ls.log" || listed=$?
          if [ "$listed" -ne 0 ] && ! grep -q 'matched no objects' "$work/ls.log"; then
            cat "$work/ls.log" >&2
            echo "::error::Could not list $SOURCE; the staging identity needs read access to it" >&2
            exit 1
          fi
          if [ "$listed" -eq 0 ]; then
            origin="$SOURCE"
            gcloud storage cp "$SOURCE/vmlinux-4.14-fuse" "$SOURCE/base.ext4" "$work/"
            kernel=$(sha256sum "$work/vmlinux-4.14-fuse" | cut -d' ' -f1)
            rootfs=$(sha256sum "$work/base.ext4" | cut -d' ' -f1)
          else
            cat "$work/ls.log" >&2
            echo "::warning::$SOURCE lacks the hostprep objects; reading from $HOST, whose rootfs includes its injected boxd" >&2
            origin="$HOST (rootfs includes the boxd injected by its last deploy)"
            kernel=$(fetch /var/lib/sandbox/kernel/vmlinux-4.14-fuse vmlinux-4.14-fuse)
            rootfs=$(fetch /var/lib/sandbox/rootfs/base.ext4 base.ext4)
          fi
          [ "$kernel" = "$KERNEL_SHA256" ] || { echo "::error::vmlinux-4.14-fuse from $origin has sha256 $kernel, not the pinned $KERNEL_SHA256"; exit 1; }
          gcloud storage cp "$work/vmlinux-4.14-fuse" "$work/base.ext4" "$BUCKET/"
          {
            echo "## Devbox hostprep seeded from $origin"
            echo
            echo "- vmlinux-4.14-fuse: \`$KERNEL_SHA256\`"
            echo "- base.ext4: \`$rootfs\`"
            echo
            echo "If base.ext4 differs from DEVBOX_ROOTFS_DIGEST in deploy/devbox/runtime-pins.env, update that pin."
          } >> "$GITHUB_STEP_SUMMARY"
