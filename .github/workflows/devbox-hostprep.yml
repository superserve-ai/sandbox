name: Devbox Hostprep Seed

# Copies the guest kernel and base rootfs from a staging host into the devbox
# hostprep bucket. The staging host is only read; the kernel must match its
# pinned digest, and the rootfs must not change while it is copied.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Staging host to copy from'
        required: true
        default: superserve-vmd-staging
        type: string

concurrency:
  group: devbox-hostprep
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    name: Seed hostprep artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      HOST: ${{ inputs.host }}
      BUCKET: gs://rayai-dev-devbox-hostprep/hostprep
      KERNEL_SHA256: 3be77273fc267d2d2c239dc081cb3955f320dd0d3790de2b02690cb7f1af6761
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy and verify
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^superserve-vmd-staging(-[0-9]+)?$ ]] || { echo "::error::Not a staging host: $HOST"; exit 1; }
          work=$(mktemp -d)
          ssh_host() {
            gcloud compute ssh "$HOST" --project=rayai-dev --zone=us-central1-a \
              --tunnel-through-iap --quiet --command="set -eu; $1" -- -T
          }
          # Reads each file once on the host and hashes exactly the bytes it
          # streams, so a deploy renaming a new rootfs into place mid-copy
          # cannot mix versions; the open file must not change while it is
          # read, and the received copy must match that digest and size.
          reader=$(base64 -w0 <<'PY'
          import hashlib, os, sys
          digest, out, size = hashlib.sha256(), sys.stdout.buffer, 0
          with open(sys.argv[1], "rb") as source:
              before = os.fstat(source.fileno())
              for block in iter(lambda: source.read(1 << 20), b""):
                  digest.update(block)
                  out.write(block)
                  size += len(block)
              after = os.fstat(source.fileno())
          out.flush()
          key = lambda st: (st.st_ino, st.st_size, st.st_mtime_ns, st.st_ctime_ns)
          stable = key(before) == key(after) and after.st_size == size
          sys.stderr.write("READ sha256=%s size=%d stable=%d\n" % (digest.hexdigest(), size, stable))
          PY
          )
          fetch() {
            local attempt read_line
            for attempt in 1 2 3; do
              if ssh_host "echo $reader | base64 -d | sudo python3 -I - $1" > "$work/$2" 2> "$work/$2.log"; then
                read_line=$(grep -o 'READ sha256=[0-9a-f]\{64\} size=[0-9]* stable=[01]' "$work/$2.log" | tail -1 || true)
                if [ "$read_line" = "READ sha256=$(sha256sum "$work/$2" | cut -d' ' -f1) size=$(stat -c %s "$work/$2") stable=1" ]; then
                  sha256sum "$work/$2" | cut -d' ' -f1
                  return 0
                fi
                echo "::warning::$2 attempt $attempt: host reported '${read_line:-nothing}', received $(stat -c %s "$work/$2") bytes with sha256 $(sha256sum "$work/$2" | cut -d' ' -f1)" >&2
              else
                cat "$work/$2.log" >&2
                echo "::warning::$2 attempt $attempt: copy failed" >&2
              fi
            done
            echo "::error::Could not copy a consistent $2 after 3 attempts" >&2
            return 1
          }
          kernel=$(fetch /var/lib/sandbox/kernel/vmlinux-4.14-fuse vmlinux-4.14-fuse)
          [ "$kernel" = "$KERNEL_SHA256" ] || { echo "::error::vmlinux-4.14-fuse does not match its pinned digest"; exit 1; }
          rootfs=$(fetch /var/lib/sandbox/rootfs/base.ext4 base.ext4)
          gcloud storage cp "$work/vmlinux-4.14-fuse" "$work/base.ext4" "$BUCKET/"
          {
            echo "## Devbox hostprep seeded from $HOST"
            echo
            echo "- vmlinux-4.14-fuse: \`$KERNEL_SHA256\`"
            echo "- base.ext4: \`$rootfs\`"
            echo
            echo "If base.ext4 differs from DEVBOX_ROOTFS_DIGEST in deploy/devbox/runtime-pins.env, update that pin."
          } >> "$GITHUB_STEP_SUMMARY"
