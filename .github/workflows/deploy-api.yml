# Deploy API — control plane (Cloud Run).
#
# Triggers:
#   - push to main on API-relevant paths: runs staging, then production
#   - workflow_dispatch with environment=staging: staging only
#   - workflow_dispatch with environment=production: staging FIRST, then production
#
# Production NEVER deploys without staging first — whether the trigger is a
# push, a dispatch, or a forced production run. Selecting "production" does
# not skip staging; it just promises to run production afterward. This is
# intentional: keeping staging in sync with production avoids a drift hazard
# where a hotfix to production leaves staging on an older revision.

name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production

  push:
    branches: [main]
    paths:
      - 'cmd/controlplane/**'
      - 'internal/api/**'
      - 'internal/config/**'
      - 'internal/db/**'
      - 'internal/hostreg/**'
      - 'internal/scheduler/**'
      - 'internal/secrets/**'
      - 'internal/supervisor/**'
      - 'internal/telemetry/**'
      - 'internal/vmdclient/**'
      - 'proto/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'

  # A push that changes both migrations and code triggers CD — Migrate and
  # this workflow with no ordering: if the new binary reaches Cloud Run
  # before the migration applies, sqlc-generated queries name columns the
  # old schema doesn't have and 500 until migrate-prod finishes. Gate the
  # deploy on the same-SHA migrate run. Pushes that touch no migrations
  # (the common case) pass through after one git diff.
  wait-for-migrations:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for same-SHA CD Migrate to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch — operator owns migration ordering; skipping gate."
            exit 0
          fi

          # Diff the WHOLE pushed range, not just the tip commit — a
          # multi-commit push can carry migrations in an earlier commit.
          # An endpoint diff (before vs sha) is exactly "what changed on
          # main since the last deployed tip", and works even for a force
          # push where `before` is no longer an ancestor.
          BEFORE="${{ github.event.before }}"
          MIGRATIONS_CHANGED=unknown
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] &&
             git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            if git diff --name-only "$BEFORE" HEAD | grep -q '^supabase/migrations/'; then
              MIGRATIONS_CHANGED=yes
            else
              MIGRATIONS_CHANGED=no
            fi
          fi

          if [ "$MIGRATIONS_CHANGED" = "no" ]; then
            echo "No migration changes in ${BEFORE}..${{ github.sha }}; skipping gate."
            exit 0
          fi

          # If the range couldn't be computed (unfetchable `before`), fall
          # through to run-detection: CD Migrate triggers off this same
          # push, so its run appears within seconds when migrations
          # changed. A short grace window distinguishes "no run will ever
          # exist" from "run pending" without blind-failing the deploy.
          echo "migrations_changed=$MIGRATIONS_CHANGED — checking CD Migrate for ${{ github.sha }}"
          # ~20 min budget (60 × 20s), then fail closed: a deploy against a
          # missing column is worse than a late deploy.
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/cd.yml/runs?head_sha=${{ github.sha }}&event=push" \
              --jq '.workflow_runs[0] | if . == null then "absent absent" else "\(.status) \(.conclusion // "pending")" end')
            status=${run% *}; conclusion=${run#* }
            echo "attempt $i: status=$status conclusion=$conclusion"
            if [ "$status" = "absent" ] && [ "$MIGRATIONS_CHANGED" = "unknown" ] && [ "$i" -ge 6 ]; then
              echo "No CD Migrate run appeared in ~2 min — push touched no migrations; proceeding."
              exit 0
            fi
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CD Migrate succeeded; proceeding."
                exit 0
              fi
              echo "CD Migrate concluded '$conclusion' — refusing to deploy against an unmigrated schema."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for CD Migrate; refusing to deploy."
          exit 1

  build-api-image:
    runs-on: ubuntu-latest
    needs: [detect-changes, wait-for-migrations]
    if: github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build controlplane image
        run: |
          docker build --platform linux/amd64 -t controlplane:${{ github.sha }} .
          docker save controlplane:${{ github.sha }} | gzip > /tmp/controlplane-image.tar.gz

      - name: Upload controlplane image artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp/controlplane-image.tar.gz
          if-no-files-found: error

  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: [detect-changes, wait-for-migrations, build-api-image]
    if: github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT }}

      # Cloud Run only auto-routes to the new revision while traffic tracks
      # "latest"; force it so a leftover pin can't keep prod on the old one.
      - name: Route traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      # A plain /health curl hits whatever serves traffic, so confirm the
      # just-deployed revision is the one actually at 100%.
      - name: Verify latest revision serves traffic
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
          curl -sf "$(echo "$DESC" | jq -r '.status.url')/health"

  deploy-production:
    needs: [detect-changes, build-api-image, deploy-staging]
    if: (github.event_name == 'push' || github.event.inputs.environment == 'production') && (github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT }}

      # Cloud Run only auto-routes to the new revision while traffic tracks
      # "latest"; force it so a leftover pin can't keep prod on the old one.
      - name: Route traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      # A plain /health curl hits whatever serves traffic, so confirm the
      # just-deployed revision is the one actually at 100%.
      - name: Verify latest revision serves traffic
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
          curl -sf "$(echo "$DESC" | jq -r '.status.url')/health"

      # The usw cell deploys as steps in this job — not a separate job — for
      # the same reason CD Migrate's cell push is a step: a second job
      # referencing the production environment would double any approval
      # gate. Steps run after the primary verify, so a bad rollout stops at
      # the primary. The cell reuses the SHA-tagged image pushed above
      # (Cloud Run pulls cross-region from Artifact Registry); steps skip
      # until CLOUD_RUN_SERVICE_USW is set (repo-level variable).
      - name: Deploy usw cell to Cloud Run
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE_USW }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION_USW }} \
            --project ${{ vars.GCP_PROJECT }}

      - name: Route usw cell traffic to the new revision
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USW }}
          ARGS="--region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      # No /health curl for the cell: it has no public invoker binding until
      # go-live, so an unauthenticated probe 403s regardless of health.
      # Ready latest revision at 100% traffic is the deploy-success signal.
      - name: Verify usw cell latest revision serves traffic
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USW }}
          ARGS="--region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
