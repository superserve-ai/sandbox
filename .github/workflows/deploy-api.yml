name: Diagnose migration baseline (read only)

on:
  workflow_dispatch:
    inputs:
      target_main_sha:
        description: 'Exact failed main revision to check; never the diagnostic branch SHA'
        required: true
        type: string
        default: '6afe77a4ea34cca8a15a6095cf702f8b91936e7d'

permissions:
  contents: read
  actions: read

concurrency:
  group: migration-baseline-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/aw/migration-baseline-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Preserve diagnostic wrapper and reproduce target checkout
        env:
          TARGET_MAIN_SHA: ${{ inputs.target_main_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          cp .github/workflows/scripts/diagnose-migration-baseline.py "$RUNNER_TEMP/diagnose-migration-baseline.py"
          git fetch --no-tags --depth=2 origin "$TARGET_MAIN_SHA"
          git checkout --detach "$TARGET_MAIN_SHA"
      - name: Run exact target check with safe diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MAIN_SHA: ${{ inputs.target_main_sha }}
        run: python3 -u "$RUNNER_TEMP/diagnose-migration-baseline.py" --target "$TARGET_MAIN_SHA" --repository "$GITHUB_REPOSITORY"
