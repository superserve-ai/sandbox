# Deploy API — control plane (Cloud Run).
#
# Triggers:
#   - push to main on API-relevant paths: runs staging, then production
#   - workflow_dispatch with environment=staging: staging only
#   - workflow_dispatch with environment=production: staging FIRST, then production
#
# Production NEVER deploys without staging first — whether the trigger is a
# push, a dispatch, or a forced production run. Selecting "production" does
# not skip staging; it just promises to run production afterward. This is
# intentional: keeping staging in sync with production avoids a drift hazard
# where a hotfix to production leaves staging on an older revision.

name: Deploy API

# Serialize all control-plane changes with the staged identity migration and
# Terraform CD. A queued deployment must not route a revision while the
# identity rollout is still applying and verifying its permissions.
concurrency:
  group: control-plane-deploy
  queue: max
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production

  push:
    branches: [main]
    paths:
      # Every internal package the control-plane binary imports must be listed,
      # or a change to it merges without deploying — silently, since a push that
      # matches no path is not a skipped job but no job at all. The
      # deploy-trigger-coverage CI check enforces this against `go list -deps`.
      - 'cmd/controlplane/**'
      - 'internal/abuse/**'
      - 'internal/analytics/**'
      - 'internal/api/**'
      - 'internal/auth/**'
      - 'internal/authz/**'
      - 'internal/backup/**'
      - 'internal/billing/**'
      - 'internal/builder/**'
      - 'internal/config/**'
      - 'internal/db/**'
      - 'internal/hostreg/**'
      - 'internal/preview/**'
      - 'internal/requestlog/**'
      - 'internal/retainedstorage/**'
      - 'internal/scheduler/**'
      - 'internal/secrets/**'
      - 'internal/sentrylog/**'
      - 'internal/supervisor/**'
      - 'internal/telemetry/**'
      - 'internal/vmdclient/**'
      - 'proto/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      # The workflow must self-trigger (as deploy-proxy and deploy-vmd do), or
      # a deployment-command fix lands without ever running until an unrelated
      # source change happens to redeploy.
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/scripts/check_controlplane_identity.py'

      # Migration-only changes also run the full prerequisite before deployment.
      - 'supabase/migrations/**'
      - 'supabase/shared-auth-history/**'
      - 'supabase/shared-auth-migrations/**'
      - 'scripts/migrate_database.py'
      - 'scripts/snapshot_reference_index.py'
      - 'scripts/retained_storage_recovery.py'
      - 'scripts/recovery_evidence.py'
      - 'scripts/migration-requirements.txt'
      - 'supabase/recovery/**'
      - '.github/workflows/recovery-evidence.yml'
      - 'scripts/test_migration_*.py'
      - '.github/workflows/cd.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/scripts/migration_gate.py'
      - '.github/workflows/scripts/test_migration_gate.py'
      - '.github/workflows/scripts/wait-for-push-ci.py'
      - '.github/workflows/deployment-migrations.yml'
      - '.github/workflows/scripts/deployment_migration_gate.py'

env:
  TF_VAR_compute_restrictions_secret_name: ${{ secrets.COMPUTE_RESTRICTIONS_SECRET_NAME }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'

  wait-for-migrations:
    needs: [detect-changes]
    if: github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true'
    uses: ./.github/workflows/deployment-migrations.yml
    permissions:
      contents: read
      actions: read
    with:
      revision: ${{ github.sha }}
      production: ${{ github.event_name == 'push' || inputs.environment == 'production' }}
      allow_branch_staging: ${{ github.event_name == 'workflow_dispatch' && inputs.environment != 'production' }}
    secrets: inherit

  build-api-image:
    runs-on: ubuntu-latest
    needs: [detect-changes, wait-for-migrations]
    if: github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build controlplane image
        run: |
          docker build --platform linux/amd64 -t controlplane:${{ github.sha }} .
          docker save controlplane:${{ github.sha }} | gzip > /tmp/controlplane-image.tar.gz

      - name: Upload controlplane image artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp/controlplane-image.tar.gz
          if-no-files-found: error

  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: [detect-changes, wait-for-migrations, build-api-image]
    if: github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE }} \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT }}

      # Cloud Run only auto-routes to the new revision while traffic tracks
      # "latest"; force it so a leftover pin can't keep prod on the old one.
      - name: Route traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      # A plain /health curl hits whatever serves traffic, so confirm the
      # just-deployed revision is the one actually at 100%.
      - name: Verify latest revision serves traffic
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE }}
          ARGS="--region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
          curl -sf "$(echo "$DESC" | jq -r '.status.url')/health"

  deploy-production:
    needs: [detect-changes, build-api-image, deploy-staging]
    if: (github.event_name == 'push' || github.event.inputs.environment == 'production') && (github.event_name != 'push' || needs.detect-changes.outputs.infra_changed != 'true')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download prebuilt controlplane image
        uses: actions/download-artifact@v4
        with:
          name: controlplane-image-${{ github.sha }}
          path: /tmp

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Load and push image
        run: |
          gzip -dc /tmp/controlplane-image.tar.gz | docker load
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane"
          docker tag controlplane:${{ github.sha }} ${IMAGE}:latest
          docker tag controlplane:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

      # use4 is the primary production cell — api.superserve.ai routes here — so
      # it deploys FIRST, right after the image push, before the usw secondary
      # cell. That way a transient failure updating or probing usw can't stop the
      # job and leave the public primary on the old image. These steps are
      # unguarded: use4 is the permanent primary, so a missing CLOUD_RUN_SERVICE_USE4
      # must fail the deploy rather than silently skip the only primary update.
      # use4 has a public invoker binding, so /health is a meaningful probe.
      - name: Deploy use4 cell to Cloud Run
        run: |
          gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE_USE4 }} \
            --region ${{ vars.GCP_REGION_USE4 }} --project ${{ vars.GCP_PROJECT }} --format=json | \
            python3 .github/workflows/scripts/check_controlplane_identity.py \
              --project ${{ vars.GCP_PROJECT }} --cell use4
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE_USE4 }} \
            --no-cpu-throttling \
            --min-instances 10 \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION_USE4 }} \
            --project ${{ vars.GCP_PROJECT }} \
            --no-traffic

      - name: Verify use4 KMS access before routing traffic
        env:
          RUNTIME_IDENTITY: superserve-controlplane-use4@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          bash scripts/verify-control-plane-kms.sh \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION_USE4 }}" \
            --service "${{ vars.CLOUD_RUN_SERVICE_USE4 }}" \
            --runtime-service-account "$RUNTIME_IDENTITY" \
            --kms-key-resource "projects/${{ vars.GCP_PROJECT }}/locations/us-central1/keyRings/superserve/cryptoKeys/credentials-kek" \
            --evidence-dir "$RUNNER_TEMP/control-plane-kms/use4" \
            --secret operator-api-token-use4 \
            --secret database-url \
            --secret internal-api-token \
            --secret sandbox-access-token-seed \
            --secret secretsproxy-signing-key \
            --secret "${TF_VAR_compute_restrictions_secret_name:?Set COMPUTE_RESTRICTIONS_SECRET_NAME}" \
            --secret sentry-dsn \
            --secret system-team-id-production \
            --secret slack-quota-alert-webhook \
            --secret posthog-project-key \
            --secret stripe-secret-key-use \
            --secret stripe-webhook-secret-use \
            --secret stripe-meter-error-webhook-secret-use

      - name: Route use4 cell traffic to the new revision
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USE4 }}
          ARGS="--region ${{ vars.GCP_REGION_USE4 }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      - name: Verify use4 cell latest revision serves traffic
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USE4 }}
          ARGS="--region ${{ vars.GCP_REGION_USE4 }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
          curl -sf "$(echo "$DESC" | jq -r '.status.url')/health"

      # The usw cell deploys as steps in this job — not a separate job — for
      # the same reason CD Migrate's cell push is a step: a second job
      # referencing the production environment would double any approval
      # gate. Runs after the primary verify and the use4 primary cell above.
      # Reuses the SHA-tagged image pushed above (Cloud Run pulls cross-region
      # from Artifact Registry); steps skip until CLOUD_RUN_SERVICE_USW is set.
      - name: Deploy usw cell to Cloud Run
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        run: |
          gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE_USW }} \
            --region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }} --format=json | \
            python3 .github/workflows/scripts/check_controlplane_identity.py \
              --project ${{ vars.GCP_PROJECT }} --cell usw2
          gcloud run services update ${{ vars.CLOUD_RUN_SERVICE_USW }} \
            --no-cpu-throttling \
            --min-instances 10 \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/superserve/controlplane:${{ github.sha }} \
            --region ${{ vars.GCP_REGION_USW }} \
            --project ${{ vars.GCP_PROJECT }} \
            --no-traffic

      - name: Verify usw KMS access before routing traffic
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        env:
          RUNTIME_IDENTITY: superserve-controlplane-usw2@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          bash scripts/verify-control-plane-kms.sh \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION_USW }}" \
            --service "${{ vars.CLOUD_RUN_SERVICE_USW }}" \
            --runtime-service-account "$RUNTIME_IDENTITY" \
            --kms-key-resource "projects/${{ vars.GCP_PROJECT }}/locations/us-central1/keyRings/superserve/cryptoKeys/credentials-kek" \
            --evidence-dir "$RUNNER_TEMP/control-plane-kms/usw2" \
            --secret operator-api-token-usw2 \
            --secret database-url-usw2 \
            --secret internal-api-token \
            --secret sandbox-access-token-seed \
            --secret secretsproxy-signing-key \
            --secret "${TF_VAR_compute_restrictions_secret_name:?Set COMPUTE_RESTRICTIONS_SECRET_NAME}" \
            --secret sentry-dsn \
            --secret system-team-id-production \
            --secret slack-quota-alert-webhook \
            --secret posthog-project-key \
            --secret stripe-secret-key-usw \
            --secret stripe-webhook-secret-usw \
            --secret stripe-meter-error-webhook-secret-usw

      - name: Route usw cell traffic to the new revision
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USW }}
          ARGS="--region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          SERVING=$(echo "$DESC" | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // "none"')
          if [ "$SERVING" != "$LATEST" ]; then
            echo "::warning::$SVC traffic was pinned to $SERVING (latest is $LATEST); auto-routing to latest — investigate the pin."
          fi
          gcloud run services update-traffic $SVC --to-latest $ARGS

      # No /health curl for the cell: it has no public invoker binding until
      # go-live, so an unauthenticated probe 403s regardless of health.
      # Ready latest revision at 100% traffic is the deploy-success signal.
      - name: Verify usw cell latest revision serves traffic
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        run: |
          SVC=${{ vars.CLOUD_RUN_SERVICE_USW }}
          ARGS="--region ${{ vars.GCP_REGION_USW }} --project ${{ vars.GCP_PROJECT }}"
          DESC=$(gcloud run services describe $SVC $ARGS --format=json)
          LATEST=$(echo "$DESC" | jq -r '.status.latestReadyRevisionName')
          PCT=$(echo "$DESC" | jq --arg r "$LATEST" '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | .percent] | add // 0')
          if [ "$PCT" != "100" ]; then
            echo "::error::$SVC: latest revision $LATEST serving ${PCT}% (want 100); deploy is not live."
            exit 1
          fi
