name: Devbox Checks

# Devbox changes stay off every deploy trigger path, so their checks live here
# rather than in ci.yml. The devbox renders the fleet host bootstrap and reuses
# the host identity installer, so changes to those run these checks too.
on:
  pull_request:
    paths:
      - 'deploy/devbox/**'
      - 'deploy/host-bootstrap/**'
      - 'deploy/install-host-identity.py'
      - '.github/workflows/scripts/devbox*'
      - '.github/workflows/devbox-checks.yml'
      - 'scripts/provision_devbox_stripe.py'
      - 'scripts/test_provision_devbox_stripe.py'
      - 'scripts/provision_storage_stripe.py'
      - 'scripts/migrate_database.py'
      - 'scripts/migrate_devbox_shared_auth.py'
      - 'scripts/test_devbox_shared_auth.py'
      - 'scripts/migrate_shared_auth.py'
      - 'scripts/test_shared_auth_migrations.py'
      - 'scripts/test_migration_cli.py'
      - 'scripts/migration-requirements.txt'
      - 'supabase/shared-auth-history/**'
      - 'supabase/shared-auth-migrations/**'
      - 'supabase/migrations/**'
      - 'internal/api/billing_pro_checkout.go'
  push:
    branches: [main]
    paths:
      - 'deploy/devbox/**'
      - 'deploy/host-bootstrap/**'
      - 'deploy/install-host-identity.py'
      - '.github/workflows/scripts/devbox*'
      - '.github/workflows/devbox-checks.yml'
      - 'scripts/provision_devbox_stripe.py'
      - 'scripts/test_provision_devbox_stripe.py'
      - 'scripts/provision_storage_stripe.py'
      - 'scripts/migrate_database.py'
      - 'scripts/migrate_devbox_shared_auth.py'
      - 'scripts/test_devbox_shared_auth.py'
      - 'scripts/migrate_shared_auth.py'
      - 'scripts/test_shared_auth_migrations.py'
      - 'scripts/test_migration_cli.py'
      - 'scripts/migration-requirements.txt'
      - 'supabase/shared-auth-history/**'
      - 'supabase/shared-auth-migrations/**'
      - 'supabase/migrations/**'
      - 'internal/api/billing_pro_checkout.go'

permissions:
  contents: read

jobs:
  shared-auth:
    name: Devbox Shared Auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: '2.119.0'

      - name: Install isolated migration dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/migration-venv"
          "$RUNNER_TEMP/migration-venv/bin/python" -m pip install -r scripts/migration-requirements.txt
          "$RUNNER_TEMP/migration-venv/bin/python" -I -c 'import psycopg'

      - name: Validate disposable shared Auth initialization
        run: '"$RUNNER_TEMP/migration-venv/bin/python" scripts/test_devbox_shared_auth.py'

  checks:
    name: Devbox Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deploy/devbox/terraform

      - name: Run profile tests
        run: python3 -m unittest discover -s deploy/devbox -p 'test_*.py'

      - name: Run services tests
        run: python3 -m unittest discover -s deploy/devbox/services -p 'test_*.py'

      - name: Run Stripe catalog bootstrap tests
        run: python3 -m unittest discover -s scripts -p 'test_provision_devbox_stripe.py'

      - name: Check devbox shell scripts
        run: find deploy/devbox -name '*.sh' -print0 | xargs -0 -r shellcheck -x -P SCRIPTDIR
