name: YC calendar candidate source checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Calendar candidate source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r deploy/staging-candidates/requirements.txt -r scripts/migration-requirements.txt
      - run: python3 -m unittest discover -s .github/workflows/scripts -p 'test_yc_calendar_*.py'
