name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-fmt:
    name: Terraform Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'

      - uses: hashicorp/setup-terraform@v3
        if: steps.changes.outputs.infra == 'true'
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.changes.outputs.infra == 'true'
        run: terraform fmt -check -recursive infra

  terraform-plan:
    name: Terraform Plan Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    env:
      HAS_GCP_AUTH: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'

      - uses: hashicorp/setup-terraform@v3
        if: steps.changes.outputs.infra == 'true'
        with:
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.infra == 'true' && env.HAS_GCP_AUTH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Summarize Terraform plans
        if: steps.changes.outputs.infra == 'true'
        env:
          HAS_GCP_AUTH: ${{ env.HAS_GCP_AUTH }}
        run: |
          set +euo pipefail

          echo "## Terraform plan summary" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [[ "$HAS_GCP_AUTH" != "true" ]]; then
            echo "Terraform plan skipped because GCP auth secrets are not configured for this workflow." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT to enable PR plans." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Terraform plan skipped::GCP auth secrets are not configured."
            exit 0
          fi

          mapfile -t env_dirs < <(
            find infra/envs -mindepth 3 -maxdepth 3 -type f -name main.tf -not -path '*/.terraform/*' -printf '%h\n'               | sort -u
          )

          if [[ ${#env_dirs[@]} -eq 0 ]]; then
            echo "No Terraform root modules were found under infra/envs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p terraform-plan-artifacts

          for env_dir in "${env_dirs[@]}"; do
            env_name="${env_dir#infra/envs/}"
            safe_name="${env_name//\//__}"
            plan_log="$PWD/terraform-plan-artifacts/${safe_name}.plan.txt"
            init_log="$PWD/terraform-plan-artifacts/${safe_name}.init.txt"
            validate_log="$PWD/terraform-plan-artifacts/${safe_name}.validate.txt"

            echo "### ${env_name}" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"

            pushd "$env_dir" >/dev/null

            terraform init -input=false -no-color > "$init_log" 2>&1
            init_status=$?
            if [[ $init_status -ne 0 ]]; then
              echo "::warning title=Terraform init failed::${env_name} terraform init failed; see artifact ${safe_name}.init.txt"
              echo "terraform init failed. See artifact \`${safe_name}.init.txt\`." >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              popd >/dev/null
              continue
            fi

            terraform validate -no-color > "$validate_log" 2>&1
            validate_status=$?
            if [[ $validate_status -ne 0 ]]; then
              echo "::warning title=Terraform validate failed::${env_name} terraform validate failed; see artifact ${safe_name}.validate.txt"
              echo "terraform validate failed. See artifact \`${safe_name}.validate.txt\`." >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              popd >/dev/null
              continue
            fi

            terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > "$plan_log" 2>&1
            plan_status=$?

            if [[ $plan_status -eq 0 ]]; then
              echo "No changes." >> "$GITHUB_STEP_SUMMARY"
            elif [[ $plan_status -eq 2 ]]; then
              plan_line="$(grep -E '^Plan:' "$plan_log" | tail -n1 || true)"
              if [[ -z "$plan_line" ]]; then
                plan_line="Terraform reported changes."
              fi
              echo "::warning title=Terraform plan has changes::${env_name}: ${plan_line}"
              echo "${plan_line}" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "Changed resources:" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -E '^  # ' "$plan_log" | sed 's/^  # //' | head -n 80 >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Terraform plan failed::${env_name} terraform plan failed; see artifact ${safe_name}.plan.txt"
              echo "terraform plan failed. See artifact \`${safe_name}.plan.txt\`." >> "$GITHUB_STEP_SUMMARY"
            fi

            echo >> "$GITHUB_STEP_SUMMARY"
            popd >/dev/null
          done

          exit 0

      - name: Upload Terraform plan logs
        if: steps.changes.outputs.infra == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-logs
          path: terraform-plan-artifacts/
          if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -v -short -count=1 -race ./...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sandbox_test?sslmode=disable
        run: go test -v -tags integration -count=1 -race -timeout 10m ./internal/integration/ ./cmd/migrate-team/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all binaries
        run: |
          go build -ldflags "-s -w" -o /dev/null ./cmd/controlplane
          go build -ldflags "-s -w" -o /dev/null ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o /dev/null ./cmd/boxd

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

  sqlc-check:
    name: sqlc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'

      - name: Verify sqlc generated code is up to date
        run: |
          sqlc generate
          if ! git diff --quiet --exit-code; then
            echo "::error::sqlc generated code is out of date. Run 'sqlc generate' and commit the result."
            git diff
            exit 1
          fi

  migration-order:
    name: Migration Order
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject migrations dated at or before the highest on main
        run: |
          git fetch origin main
          HIGHEST_MAIN=$(git ls-tree -r origin/main --name-only \
            | grep '^supabase/migrations/' \
            | grep -oE '[0-9]{14}' \
            | sort -n | tail -n1)
          if [ -z "$HIGHEST_MAIN" ]; then
            echo "no migrations on main yet; nothing to compare against"
            exit 0
          fi
          echo "highest version on main: $HIGHEST_MAIN"

          NEW=$(git diff --name-status origin/main...HEAD -- supabase/migrations/ \
            | awk '$1=="A" {print $2}')
          if [ -z "$NEW" ]; then
            echo "no new migrations in this PR"
            exit 0
          fi

          fail=0
          for file in $NEW; do
            v=$(basename "$file" | grep -oE '^[0-9]{14}')
            if [ "$v" -le "$HIGHEST_MAIN" ]; then
              echo "::error file=$file::migration $v is at or before highest-on-main $HIGHEST_MAIN — supabase db push will refuse without --include-all; bump the timestamp"
              fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "all new migrations are correctly ordered"
          exit $fail
