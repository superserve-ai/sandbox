name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -v -short -count=1 -race ./...

      - name: Run deploy-script tests
        run: python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sandbox_test?sslmode=disable
        run: go test -v -tags integration -count=1 -race -timeout 10m ./internal/integration/ ./cmd/migrate-team/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all binaries
        run: |
          go build -ldflags "-s -w" -o /dev/null ./cmd/controlplane
          go build -ldflags "-s -w" -o /dev/null ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o /dev/null ./cmd/boxd

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

  fc-client-check:
    name: FC Client Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify the Firecracker client matches the spec
        run: |
          go generate ./internal/vm/fc/...
          if ! git diff --quiet --exit-code; then
            echo "::error::Firecracker client is out of date. Run 'go generate ./internal/vm/fc/...' and commit the result."
            git diff --stat
            exit 1
          fi

  sqlc-check:
    name: sqlc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'

      - name: Verify sqlc generated code is up to date
        run: |
          sqlc generate
          if ! git diff --quiet --exit-code; then
            echo "::error::sqlc generated code is out of date. Run 'sqlc generate' and commit the result."
            git diff
            exit 1
          fi

  migration-order:
    name: Migration Order
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject migrations dated at or before the highest on main
        run: |
          git fetch origin main
          HIGHEST_MAIN=$(git ls-tree -r origin/main --name-only \
            | grep '^supabase/migrations/' \
            | grep -oE '[0-9]{14}' \
            | sort -n | tail -n1)
          if [ -z "$HIGHEST_MAIN" ]; then
            echo "no migrations on main yet; nothing to compare against"
            exit 0
          fi
          echo "highest version on main: $HIGHEST_MAIN"

          NEW=$(git diff --name-status origin/main...HEAD -- supabase/migrations/ \
            | awk '$1=="A" {print $2}')
          if [ -z "$NEW" ]; then
            echo "no new migrations in this PR"
            exit 0
          fi

          fail=0
          for file in $NEW; do
            v=$(basename "$file" | grep -oE '^[0-9]{14}')
            if [ "$v" -le "$HIGHEST_MAIN" ]; then
              echo "::error file=$file::migration $v is at or before highest-on-main $HIGHEST_MAIN — supabase db push will refuse without --include-all; bump the timestamp"
              fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "all new migrations are correctly ordered"
          exit $fail

  deploy-trigger-coverage:
    name: Deploy Trigger Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A push touching only paths absent from a deploy workflow's filters runs
      # no job at all — the change merges and never ships, with nothing in the
      # Actions tab to notice. Derive what each workflow builds and require its
      # filters to cover everything those binaries are built from.
      - name: Every imported package must trigger its deploy
        run: |
          fail=0
          # A source directory is covered only by a recursive filter on it or an
          # ancestor. GitHub's non-recursive form matches a file at exactly that
          # path, so 'internal/db' does NOT start a deploy for internal/db/db.go
          # — treating the two forms alike would pass a workflow that never fires.
          covered_dir() {
            for t in $2; do
              case "$t" in */'**') base=${t%/'**'};; *) continue;; esac
              case "$1" in "$base"|"$base"/*) return 0;; esac
            done
            return 1
          }
          # A single file is covered by naming it exactly, or by a recursive
          # filter on a directory above it.
          covered_file() {
            for t in $2; do
              case "$t" in
                */'**') base=${t%/'**'}; case "$1" in "$base"/*) return 0;; esac ;;
                *) [ "$1" = "$t" ] && return 0 ;;
              esac
            done
            return 1
          }
          report() {
            echo "::error file=$1::$1 does not list $2 in its trigger paths — changes to $2 would merge without deploying"
            fail=1
          }
          check() {
            workflow="$1"; files="$2"; shift 2
            # Globs are kept, not stripped: the two filter forms mean different
            # things and covered_dir/covered_file rely on telling them apart.
            # Only real sequence entries count: a commented-out path (# - '...')
            # is ignored by GitHub and must be ignored here too, or the check
            # blesses exactly the silent missed deployment it exists to catch.
            triggers=$(awk '/^on:/,/^jobs:/' "$workflow" \
              | sed -n "s/^[[:space:]]*- '\([A-Za-z.][A-Za-z0-9._/*-]*\)'.*/\1/p" | sort -u || true)
            # Module-local deps — not just internal/, since the proxy reaches
            # proto/boxdpb and stale generated protocol code is the same hazard.
            deps=$(go list -deps "$@" \
              | sed -n 's|^github.com/superserve-ai/sandbox/||p' | sort -u)
            for path in $deps; do
              covered_dir "$path" "$triggers" || report "$workflow" "$path"
            done
            # Module files, any Dockerfile this workflow builds through, and
            # the workflow itself: a dependency bump, an image change, or a
            # deployment-command fix must each redeploy too.
            for path in go.mod go.sum "$workflow" $files; do
              covered_file "$path" "$triggers" || report "$workflow" "$path"
            done
          }
          # Expand the workflow list while globbing is still on, then turn it off
          # for the rest: trigger patterns contain ** and must be compared as
          # literals, not expanded against the working tree.
          workflows=$(echo .github/workflows/deploy-*.yml)
          set -f
          # Binaries come from each workflow's build commands (or the Dockerfile
          # it builds), never from its path filters: deriving them from the very
          # list being validated would let an omitted cmd/ entry hide itself.
          # `|| true` throughout: the step runs under `-eo pipefail`, so an
          # unmatched grep would kill the job instead of reaching the checks.
          for wf in $workflows; do
            files=""
            bins=$(grep -oE 'go build[^|;]*\./cmd/[a-z-]+' "$wf" \
              | grep -oE '\./cmd/[a-z-]+' | sort -u || true)
            if [ -z "$bins" ] && grep -q 'docker build' "$wf"; then
              bins=$(grep -oE 'go build[^|;]*\./cmd/[a-z-]+' Dockerfile \
                | grep -oE '\./cmd/[a-z-]+' | sort -u || true)
              files="Dockerfile"
            fi
            if [ -z "$bins" ]; then
              echo "$(basename "$wf"): builds no Go binary, skipping"
              continue
            fi
            echo "$(basename "$wf"): $(echo $bins)"
            check "$wf" "$files" $bins
          done
          [ $fail -eq 0 ] && echo "deploy triggers cover every imported package"
          exit $fail
