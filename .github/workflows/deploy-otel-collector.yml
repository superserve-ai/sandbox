# Deploy OTEL Collector — host-local collector on VMD hosts.

name: Deploy OTEL Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/otel/**'
      - 'deploy/superserve-otel-collector.service'
      - '.github/workflows/deploy-otel-collector.yml'
      - '.github/workflows/scripts/deploy-otel-collector.py'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy OTEL Collector to VMD instances
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          OTEL_COLLECTOR_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          python3 .github/workflows/scripts/deploy-otel-collector.py
