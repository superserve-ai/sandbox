# Deploy VMD — control plane VMs.
#
# Production NEVER deploys without staging first — same discipline as Deploy API.
# The deploy-production job reuses the same step body as deploy-staging; env vars
# like GCP_PROJECT resolve per-environment from GitHub environment vars.
# The us-west2 cell host deploys as a final production step, after the
# primary region succeeds — same shape as Deploy API's usw cell steps.

name: Deploy VMD

concurrency:
  group: deploy-vmd-hosts
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production
      diagnostics_only:
        description: 'Read-only staging host-drain diagnostics (no deploy)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vmd.yml'
      - '.github/workflows/scripts/deploy-vmd.py'
      - 'cmd/vmd/**'
      - 'cmd/boxd/**'
      - 'cmd/template-builder/**'
      - 'cmd/secretsproxy/**'
      - 'internal/vm/**'
      - 'internal/network/**'
      - 'internal/builder/**'
      - 'internal/db/**'
      - 'internal/secretsproxy/**'
      - 'deploy/superserve-vmd.service'
      - 'deploy/superserve-vmd.socket'
      - 'deploy/superserve-secretsproxy.service'
      - 'deploy/firecracker@.service'
      - 'deploy/firecracker-netns@.service'
      - 'deploy/sandboxes.slice'
      - 'deploy/sandbox-data-disk.service'
      - 'scripts/fc-cleanup'
      - 'scripts/setup-sandbox-data-disk.sh'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.diagnostics_only != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.diagnostics_only != 'true'
        # Always build all four. Hash-compare on the host decides whether
        # to install boxd / secretsproxy, so a no-op is cheap at rest.
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/vmd ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/boxd ./cmd/boxd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/template-builder ./cmd/template-builder
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/secretsproxy ./cmd/secretsproxy

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      # GCP_REGION scopes label discovery to the primary region so the
      # usw cell host (same project, same label) isn't folded into this
      # fan-out — the cell deploys sequentially after production below.
      - name: Discover and deploy to VMD instances
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.diagnostics_only != 'true'
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          # Saved-snapshot runtime capabilities are deliberately enabled in
          # the staging playground. Production omits these optional deploy
          # inputs and keeps the host's existing values unchanged.
          VMD_UFFD_ENABLED: 'true'
          VMD_RESUME_UFFD: 'true'
          VMD_INCREMENTAL_SNAPSHOT: 'true'
          VMD_SAVED_SNAPSHOT_PREFLIGHT: 'true'
          SANDBOX_DATA_DISK_DEVICE: '/dev/disk/by-id/google-superserve-sandbox-data'
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SHA: ${{ github.sha }}
        run: |
          # Emit drain counts as they change; Python otherwise block-buffers
          # output in Actions and hides the safety-gate state until job exit.
          python3 -u .github/workflows/scripts/deploy-vmd.py

      - name: Diagnose staging host drain
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.diagnostics_only == 'true'
        timeout-minutes: 10
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          VMD_DRAIN_DIAGNOSTICS_ONLY: 'true'
          VMD_DIAGNOSTIC_HOST_ID: 'default'
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SHA: ${{ github.sha }}
        run: |
          python3 -u .github/workflows/scripts/deploy-vmd.py

  deploy-production:
    if: (github.event_name == 'push' || github.event.inputs.environment == 'production') && (github.event_name != 'workflow_dispatch' || github.event.inputs.diagnostics_only != 'true')
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        # Always build all four; hash-compare on the host decides install.
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/vmd ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/boxd ./cmd/boxd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/template-builder ./cmd/template-builder
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags '-s -w' -trimpath -o bin/secretsproxy ./cmd/secretsproxy

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # GCP_REGION keeps this fan-out on the primary region's hosts only;
      # the usw cell host shares the project and label but deploys in the
      # step below, after the primary succeeds.
      - name: Discover and deploy to VMD instances
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          python3 -u .github/workflows/scripts/deploy-vmd.py

      # The usw cell deploys as a step in this job — not a separate job —
      # for the same reason Deploy API / CD Migrate / Seed Templates do it
      # this way: a second job referencing the production environment would
      # double any approval gate. Running after the primary step means a bad
      # rollout stops at the primary, and the step reuses the binaries built
      # above (build once, deploy per region). Skipped until
      # CLOUD_RUN_SERVICE_USW (the repo-level cell-exists flag) is set.
      # Discovery is the same VMD_LABEL filter scoped to GCP_REGION_USW, so
      # the cell host must carry the label; zero matches fails the deploy
      # rather than silently skipping the cell.
      - name: Deploy to usw cell VMD instances
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USW }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          python3 -u .github/workflows/scripts/deploy-vmd.py
