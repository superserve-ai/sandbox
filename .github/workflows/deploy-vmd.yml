# Deploy VMD — control plane VMs.
#
# Production NEVER deploys without staging first — same discipline as Deploy API.
# The deploy-production job reuses the same step body as deploy-staging; env vars
# like GCP_PROJECT resolve per-environment from GitHub environment vars.
# The us-west2 cell host deploys as a final production step, after the
# primary region succeeds — same shape as Deploy API's usw cell steps.

name: Deploy VMD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging always runs first)'
        required: false
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    paths:
      - 'cmd/vmd/**'
      - 'cmd/boxd/**'
      - 'cmd/template-builder/**'
      - 'cmd/secretsproxy/**'
      - 'proto/**'
      - 'internal/vm/**'
      - 'internal/backup/**'
      - 'internal/telemetry/**'
      - 'internal/network/**'
      - 'internal/builder/**'
      - 'internal/db/**'
      - 'internal/secretsproxy/**'
      - 'deploy/superserve-vmd.service'
      - 'deploy/superserve-vmd.socket'
      - 'deploy/superserve-vms.service'
      - 'deploy/vmd-rollback-guard'
      - 'deploy/superserve-vmd-rollback-guard.conf'
      - 'deploy/superserve-vmd-start-generation.conf'
      - 'deploy/superserve-secretsproxy.service'
      - 'deploy/firecracker@.service'
      - 'deploy/firecracker-netns@.service'
      - 'deploy/sandboxes.slice'
      - 'deploy/needrestart-superserve.conf'
      - 'deploy/apt-no-auto-upgrades.conf'
      - 'deploy/maintenance-watch.sh'
      - 'deploy/superserve-maintenance-watch.service'
      - 'deploy/superserve-maintenance-watch.timer'
      - 'scripts/fc-cleanup'
      # The workflow + its deploy script must self-trigger (as deploy-otel does),
      # or a new cell/step lands without ever running until an unrelated vmd
      # asset changes — leaving that host on stale binaries.
      - '.github/workflows/deploy-vmd.yml'
      - '.github/workflows/scripts/deploy-vmd.py'

# Serialize runs rather than canceling: deploy-vmd.py stops vmd, rewrites
# /etc/sandbox/vmd.env, and restarts it non-atomically across several steps
# per host. Two overlapping runs racing that sequence on the same host can
# interleave (e.g. both pass the backup-journal migration's source-present
# check before either finishes), and canceling a run mid-sequence would
# leave a host stopped or on a half-written env file. A queued run always
# starts from the finished state of the one before it.
concurrency:
  group: deploy-vmd
  cancel-in-progress: false

jobs:
  # Failing CI must not reach production control-plane hosts. CI is a
  # separate workflow, so `needs:` can't reach it directly — poll the
  # same-SHA run instead, same pattern as Deploy API's wait-for-migrations.
  wait-for-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for same-SHA CI to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch — operator owns this decision; skipping gate."
            exit 0
          fi

          # CI runs on every push to main (no path filter), so a run for this
          # SHA always exists — poll until it's visible and completed. ~20 min
          # budget (60 × 20s), then fail closed: a deploy built from code that
          # hasn't passed CI is worse than a late deploy.
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=push" \
              --jq '.workflow_runs[0] | if . == null then "absent absent" else "\(.status) \(.conclusion // "pending")" end')
            status=${run% *}; conclusion=${run#* }
            echo "attempt $i: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI succeeded; proceeding."
                exit 0
              fi
              echo "CI concluded '$conclusion' — refusing to deploy unvalidated code."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for CI; refusing to deploy."
          exit 1

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        # Always build all four. Hash-compare on the host decides whether
        # to install boxd / secretsproxy, so a no-op is cheap at rest.
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/vmd ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/boxd ./cmd/boxd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/template-builder ./cmd/template-builder
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/secretsproxy ./cmd/secretsproxy

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # GCP_REGION scopes label discovery to the primary region so the
      # usw cell host (same project, same label) isn't folded into this
      # fan-out — the cell deploys sequentially after production below.
      - name: Discover and deploy to VMD instances
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          # Fleet defaults for paused-network reclaim live in deployment
          # config, not the binary. Operators can override them per host in
          # /etc/sandbox/vmd.env after deployment.
          VMD_PAUSED_NETWORK_RECLAIM: "true"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_PERCENT: "0"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_RESERVE: "42000"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_NETNS_THRESHOLD: "6000"
          VMD_PAUSED_NETWORK_NETNS_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_MOUNT_THRESHOLD: "0"
          VMD_PAUSED_NETWORK_MOUNT_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_MIN_WARM_AGE: "0s"
          VMD_PAUSED_NETWORK_MAX_RECLAIMS: "150"
          VMD_PAUSED_NETWORK_RECLAIM_COOLDOWN: "30s"
          # Staging validates the backup uploader first; the production
          # cells get their buckets after the staging soak.
          BACKUP_BUCKET: superserve-artifact-backup-staging-usc1
          # Stage one of the backfill rollout: staging first, then use4,
          # then usw2, each gated on coverage convergence verified via
          # the backup_generation table. Removing this line disables the
          # sweep on the next deploy.
          BACKUP_BACKFILL: "1"
          # Keeps the backup journal off the root disk — it's written
          # continuously while backups drain and can stall the uploader
          # if the (small) root disk fills. Staging is a smaller instance
          # with no NVMe-backed local SSD (unlike use4/usw2), so this
          # points at its attached persistent disk instead of /mnt/localssd.
          BACKUP_JOURNAL_PATH: /mnt/sandbox-data/backup.db
          # Staging validates parallel drain first; production stays on
          # vmd's single-worker default until this soaks. Workers share
          # one bandwidth cap, so this raises task throughput only.
          BACKUP_UPLOAD_CONCURRENCY: "2"
          # Enables vmd's backup metrics exporter (host-local collector);
          # the backup alert policies read these series.
          OTEL_ENVIRONMENT: staging
          MAINTENANCE_ALERT_WEBHOOK: ${{ secrets.MAINTENANCE_ALERT_WEBHOOK }}
        run: |
          python3 .github/workflows/scripts/deploy-vmd.py

  deploy-production:
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        # Always build all four; hash-compare on the host decides install.
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/vmd ./cmd/vmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/boxd ./cmd/boxd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/template-builder ./cmd/template-builder
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -trimpath -o bin/secretsproxy ./cmd/secretsproxy

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # The use4 cell host is the primary production host — api.superserve.ai
      # routes there — so it deploys FIRST, before the usw secondary cell. A
      # failure or zero-match in usw must not stop the job and leave the public
      # host on old vmd/boxd/secretsproxy binaries. Reuses the binaries built
      # above. Unguarded: use4 is the permanent primary, so a missing
      # CLOUD_RUN_SERVICE_USE4/GCP_REGION_USE4 must fail the deploy rather than
      # silently skip the only primary-host rollout. Discovery is the VMD_LABEL
      # filter scoped to GCP_REGION_USE4 (deploy-vmd.py fails on zero matches).
      - name: Deploy to use4 cell VMD instances
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USE4 }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          # Fleet defaults for paused-network reclaim live in deployment
          # config, not the binary. Operators can override them per host in
          # /etc/sandbox/vmd.env after deployment.
          VMD_PAUSED_NETWORK_RECLAIM: "true"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_PERCENT: "0"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_RESERVE: "42000"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_NETNS_THRESHOLD: "6000"
          VMD_PAUSED_NETWORK_NETNS_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_MOUNT_THRESHOLD: "0"
          VMD_PAUSED_NETWORK_MOUNT_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_MIN_WARM_AGE: "0s"
          VMD_PAUSED_NETWORK_MAX_RECLAIMS: "150"
          VMD_PAUSED_NETWORK_RECLAIM_COOLDOWN: "30s"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BACKUP_BUCKET: superserve-artifact-backup-use4
          # Stage two of the backfill rollout, expedited: 585 of the
          # cell's 678 paused sandboxes predate the uploader and have no
          # copy off the host's SSD, which has now failed twice in one
          # day. The sweep makes them durable within hours of the host
          # returning. Removing this line disables the sweep on the next
          # deploy.
          BACKUP_BACKFILL: "1"
          # Keeps the backup journal off the root disk — it's written
          # continuously while backups drain and can stall the uploader
          # if the (small) root disk fills.
          BACKUP_JOURNAL_PATH: /mnt/localssd/backup.db
          # Enables vmd's backup metrics exporter (host-local collector);
          # the cell's backup alert policies, including backup-disabled,
          # cannot fire without these series.
          OTEL_ENVIRONMENT: production
          # use4 is the "use" cell's Supabase + control plane.
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          INTERNAL_API_TOKEN: ${{ secrets.PROD_INTERNAL_API_TOKEN }}
          MAINTENANCE_ALERT_WEBHOOK: ${{ secrets.MAINTENANCE_ALERT_WEBHOOK }}
        run: |
          # Fail closed: an empty GCP_REGION makes deploy-vmd.py drop the region
          # filter and fan out to every VMD_LABEL match. use4 is the permanent
          # primary, so a missing GCP_REGION_USE4 must abort, not run unscoped.
          : "${GCP_REGION:?GCP_REGION_USE4 is unset — refusing an unscoped use4 primary fan-out}"
          # deploy-vmd.py treats an empty CONTROL_PLANE_URL/DATABASE_URL/
          # INTERNAL_API_TOKEN as "skip, leave the host's existing value alone" —
          # the right behavior for staging/unprovisioned hosts, but silently
          # deploying-and-reporting-success while these are unset on a
          # production host is exactly the failure mode this workflow exists
          # to prevent. Fail closed rather than skip.
          : "${CONTROL_PLANE_URL:?CONTROL_PLANE_URL_PROD is unset — refusing to deploy without it}"
          : "${DATABASE_URL:?DATABASE_URL_PROD is unset — refusing to deploy without it}"
          : "${INTERNAL_API_TOKEN:?PROD_INTERNAL_API_TOKEN is unset — refusing to deploy without it}"
          python3 .github/workflows/scripts/deploy-vmd.py

      # The usw cell deploys as a step in this job — not a separate job —
      # for the same reason Deploy API / CD Migrate / Seed Templates do it
      # this way: a second job referencing the production environment would
      # double any approval gate. Reuses the binaries built above; skipped
      # until CLOUD_RUN_SERVICE_USW is set. Discovery is the VMD_LABEL filter
      # scoped to GCP_REGION_USW, so the cell host must carry the label; zero
      # matches fails the deploy rather than silently skipping the cell.
      - name: Deploy to usw cell VMD instances
        if: vars.CLOUD_RUN_SERVICE_USW != ''
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION_USW }}
          VMD_LABEL: ${{ vars.VMD_LABEL }}
          VMD_SERVICE: ${{ vars.VMD_SERVICE }}
          VMD_INSTALL_DIR: ${{ vars.VMD_INSTALL_DIR }}
          SHA: ${{ github.sha }}
          # Fleet defaults for paused-network reclaim live in deployment
          # config, not the binary. Operators can override them per host in
          # /etc/sandbox/vmd.env after deployment.
          VMD_PAUSED_NETWORK_RECLAIM: "true"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_PERCENT: "0"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_RESERVE: "42000"
          VMD_PAUSED_NETWORK_SLOT_HEADROOM_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_NETNS_THRESHOLD: "6000"
          VMD_PAUSED_NETWORK_NETNS_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_MOUNT_THRESHOLD: "0"
          VMD_PAUSED_NETWORK_MOUNT_HYSTERESIS: "3000"
          VMD_PAUSED_NETWORK_MIN_WARM_AGE: "0s"
          VMD_PAUSED_NETWORK_MAX_RECLAIMS: "150"
          VMD_PAUSED_NETWORK_RECLAIM_COOLDOWN: "30s"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # usw is its own cell — separate Supabase project + control plane
          # from the "use" cell above.
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL_USW }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_USWEST }}
          INTERNAL_API_TOKEN: ${{ secrets.PROD_USW_INTERNAL_API_TOKEN }}
          # Enables the pause-backup uploader for the cell (validated on
          # staging first; the bucket is create-only for hosts).
          BACKUP_BUCKET: superserve-artifact-backup-usw2
          # Sweeps paused sandboxes that predate the uploader into the
          # backup bucket; without it they have no copy off the host's
          # local SSD. Backfill work rides the best-effort tier, so live
          # pause uploads keep queue priority and egress stays under the
          # shared bandwidth cap. Removing this line disables the sweep
          # on the next deploy.
          BACKUP_BACKFILL: "1"
          # Keeps the backup journal off the root disk — it's written
          # continuously while backups drain and can stall the uploader
          # if the (small) root disk fills.
          BACKUP_JOURNAL_PATH: /mnt/localssd/backup.db
          # Drain workers to clear the cell's pause-backup backlog:
          # arrivals outpace the single-worker default here. Workers
          # share one bandwidth cap (task throughput rises, egress does
          # not), and the incremental host cost is one extra hash/read
          # stream on a 192-core metal host with a 12-drive array.
          # Arrivals are not steady: a share of this cell's traffic pauses
          # in scheduled batches rather than continuously, so a batch can
          # arrive faster than it drains even when the hourly average is
          # comfortable. At 6 workers a batch took long enough to drain
          # that the next one landed before the backlog cleared, so the
          # backlog-age alert paged on every batch (confirmed against
          # backup_journal_pending{priority="pause"} and the control
          # plane's pause-endpoint request log). 12 workers roughly halves
          # the drain time, leaving real idle time between batches;
          # re-check against the same series if batch sizes grow.
          # Aggregate egress stays under the shared bandwidth cap (~22
          # Mbit/s observed at 2 workers, cap 100) since throughput here
          # is bounded by per-task overhead, not bandwidth. Rollback is
          # lowering the number.
          BACKUP_UPLOAD_CONCURRENCY: "12"
          # Enables vmd's backup metrics exporter (host-local collector);
          # the cell's backup alert policies, including backup-disabled,
          # cannot fire without these series.
          OTEL_ENVIRONMENT: production
          MAINTENANCE_ALERT_WEBHOOK: ${{ secrets.MAINTENANCE_ALERT_WEBHOOK }}
        run: |
          # Fail closed: an empty GCP_REGION makes deploy-vmd.py drop the region
          # filter and fan out to every VMD_LABEL match — which would push
          # usw's DATABASE_URL/CONTROL_PLANE_URL/INTERNAL_API_TOKEN onto the
          # use4 primary host below instead of just skipping usw. This must
          # abort before the fail-closed checks below, not run unscoped.
          : "${GCP_REGION:?GCP_REGION_USW is unset — refusing an unscoped usw fan-out}"
          # Same fail-closed reasoning as the use4 step above — see its comment.
          : "${CONTROL_PLANE_URL:?CONTROL_PLANE_URL_USW is unset — refusing to deploy without it}"
          : "${DATABASE_URL:?DATABASE_URL_USWEST is unset — refusing to deploy without it}"
          : "${INTERNAL_API_TOKEN:?PROD_USW_INTERNAL_API_TOKEN is unset — refusing to deploy without it}"
          python3 .github/workflows/scripts/deploy-vmd.py
