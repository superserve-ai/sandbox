syntax = "proto3";

package superserve.boxd.v1;

option go_package = "github.com/superserve-ai/sandbox/proto/boxdpb";

// ---------------------------------------------------------------------------
// Process service — exec and PTY
// ---------------------------------------------------------------------------

service ProcessService {
  // Start runs a command and streams output events (stdout/stderr/exit).
  // For PTY mode, set the pty field in StartRequest.
  rpc Start(StartRequest) returns (stream ProcessEvent);

  // SendInput sends input to a running process (stdin or PTY input).
  rpc SendInput(SendInputRequest) returns (SendInputResponse);

  // Resize resizes the PTY window of a running process.
  rpc Resize(ResizeRequest) returns (ResizeResponse);

  // Signal sends a signal to a running process.
  rpc Signal(SignalRequest) returns (SignalResponse);
}

message StartRequest {
  string cmd = 1;
  repeated string args = 2;
  map<string, string> envs = 3;
  string cwd = 4;
  PtyConfig pty = 5;     // If set, run in PTY mode.
  uint32 timeout_ms = 6; // 0 = no timeout.
  // User to run the command as. Empty falls back to boxd's default user
  // (set by the template or root).
  string user = 7;
  // If true, attach a stdin pipe (interactive, for SendInput). False leaves
  // stdin at /dev/null/EOF so non-interactive tools (apt/debconf) don't hang.
  bool stdin = 8;
}

message PtyConfig {
  TerminalSize size = 1;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ProcessEvent {
  oneof event {
    StartEvent start = 1;
    DataEvent data = 2;
    EndEvent end = 3;
    KeepAlive keepalive = 4;
  }
}

message StartEvent {
  uint32 pid = 1;
}

message DataEvent {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
    bytes pty_data = 3;
  }
}

message EndEvent {
  int32 exit_code = 1;
  bool exited = 2;
  string status = 3;
  string error = 4;
}

message KeepAlive {}

message SendInputRequest {
  uint32 pid = 1;
  bytes data = 2;
  // When true, close the process's stdin after writing data, signalling EOF.
  // Applies to non-PTY processes; ignored in PTY mode.
  bool eof = 3;
}

message SendInputResponse {}

message ResizeRequest {
  uint32 pid = 1;
  TerminalSize size = 2;
}

message ResizeResponse {}

message SignalRequest {
  uint32 pid = 1;
  int32 signal = 2;
}

message SignalResponse {}

// ---------------------------------------------------------------------------
// Filesystem service — file operations
// ---------------------------------------------------------------------------

service FilesystemService {
  // Stat returns file info.
  rpc Stat(StatRequest) returns (StatResponse);

  // ListDir lists directory contents.
  rpc ListDir(ListDirRequest) returns (ListDirResponse);

  // MakeDir creates a directory.
  rpc MakeDir(MakeDirRequest) returns (MakeDirResponse);

  // Remove removes a file or directory.
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // Move renames/moves a file.
  rpc Move(MoveRequest) returns (MoveResponse);
}

message StatRequest {
  string path = 1;
}

message StatResponse {
  string name = 1;
  int64 size = 2;
  bool is_dir = 3;
  string mode = 4;
  int64 modified_unix = 5;
}

message ListDirRequest {
  string path = 1;
}

message ListDirResponse {
  repeated FileEntry entries = 1;
}

message FileEntry {
  string name = 1;
  bool is_dir = 2;
  int64 size = 3;
  // Unix seconds. Absent (0) on older boxd; the control plane and console
  // tolerate 0 and hide the date.
  int64 modified_unix = 4;
}

message MakeDirRequest {
  string path = 1;
}

message MakeDirResponse {}

message RemoveRequest {
  string path = 1;
}

message RemoveResponse {}

message MoveRequest {
  string source = 1;
  string destination = 2;
}

message MoveResponse {}

// ---------------------------------------------------------------------------
// Desktop service — GUI screenshot capture and input injection
// ---------------------------------------------------------------------------

service DesktopService {
  // Screenshot captures a single frame of the desktop. This is the primitive
  // for the agent control loop (screenshot -> decide -> act); unlike Stream it
  // holds no per-sandbox slot, so it always works even while a stream is
  // active.
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);

  // Stream captures the desktop as a sequence of frame events at the
  // requested cadence. Lifecycle mirrors ProcessService.Start: a Start event
  // reports the display size, Data events carry frames, and an End event
  // closes the stream (client cancellation or an unrecoverable capture
  // failure). Only one frame stream may be active per sandbox.
  rpc Stream(FrameConfig) returns (stream Frame);

  // SendActions executes an ordered batch of input actions in a single
  // request. The whole batch is validated before any action runs, then
  // executed under the same input lock that serializes individual input RPCs,
  // so no other input can interleave mid-batch. Execution stops at the first
  // failing action; the error names its index, and later actions never run.
  rpc SendActions(ActionBatch) returns (ActionBatchResponse);

  // Step executes an ordered action batch exactly as SendActions does, then
  // captures the frame before releasing the input lock, so an agent turn is
  // one round trip and the frame reflects exactly this batch. The frame is
  // captured even when the batch stops at a failing action, so the caller
  // can see the state its input left behind.
  rpc Step(StepRequest) returns (StepResponse);

  // SendPointer moves the pointer and/or presses/releases/clicks a button.
  rpc SendPointer(PointerEvent) returns (PointerResponse);

  // SendKey presses a key (optionally with modifiers) or types literal text.
  rpc SendKey(KeyEvent) returns (KeyResponse);

  // Scroll scrolls the viewport under the pointer.
  rpc Scroll(ScrollEvent) returns (ScrollResponse);

  // Resize changes the virtual display resolution. Width must be a multiple
  // of 8 between 320 and 8192; height must be between 200 and 8192. Restart an
  // active frame stream after resizing so its Start dimensions stay current.
  rpc Resize(DesktopResizeRequest) returns (DesktopResizeResponse);
}

enum FrameFormat {
  FRAME_FORMAT_UNSPECIFIED = 0; // Server picks the default (PNG).
  FRAME_FORMAT_PNG = 1;
  // Lossy, fixed quality; several times smaller and faster to encode than
  // PNG, for loops where a model reads the frame.
  FRAME_FORMAT_JPEG = 2;
}

message ScreenshotRequest {
  FrameFormat format = 1;
}

message ScreenshotResponse {
  bytes image = 1;
  uint32 width = 2;
  uint32 height = 3;
  FrameFormat format = 4;
}

message FrameConfig {
  // Desired frames per second. 0 uses the server default (currently 4);
  // values above the server maximum are clamped.
  uint32 fps = 1;
  FrameFormat format = 2;
}

// Frame follows the same start/data/end/keepalive envelope as ProcessEvent.
message Frame {
  oneof event {
    FrameStartEvent start = 1;
    FrameDataEvent data = 2;
    FrameEndEvent end = 3;
    KeepAlive keepalive = 4;
  }
}

message FrameStartEvent {
  uint32 width = 1;
  uint32 height = 2;
  FrameFormat format = 3;
}

message FrameDataEvent {
  bytes image = 1;
  int64 timestamp_unix_ms = 2;
  uint64 sequence = 3;
}

message FrameEndEvent {
  string status = 1; // e.g. "cancelled", "error"
  string error = 2;  // populated when status == "error"
}

enum PointerButton {
  POINTER_BUTTON_UNSPECIFIED = 0; // Defaults to left for actions that need one.
  POINTER_BUTTON_LEFT = 1;
  POINTER_BUTTON_RIGHT = 2;
  POINTER_BUTTON_MIDDLE = 3;
}

enum PointerAction {
  POINTER_ACTION_UNSPECIFIED = 0;
  POINTER_ACTION_MOVE = 1;
  POINTER_ACTION_DOWN = 2;
  POINTER_ACTION_UP = 3;
  POINTER_ACTION_CLICK = 4;
  POINTER_ACTION_DOUBLE_CLICK = 5;
}

message PointerEvent {
  int32 x = 1;
  int32 y = 2;
  PointerButton button = 3;
  PointerAction action = 4;
}

message PointerResponse {}

message KeyEvent {
  oneof input {
    // Symbolic key or chord, xdotool `key` syntax (e.g. "Return", "ctrl+c").
    string key = 1;
    // Literal text to type, xdotool `type` syntax.
    string text = 2;
  }
  // Held while pressing `key` (e.g. "ctrl", "shift", "alt"); ignored for `text`.
  repeated string modifiers = 3;
}

message KeyResponse {}

message ScrollEvent {
  int32 dx = 1;
  int32 dy = 2;
}

message ScrollResponse {}

// Action is one step of a SendActions batch, reusing the unary input
// messages so a batch element validates exactly like its standalone RPC.
message Action {
  oneof action {
    PointerEvent pointer = 1;
    KeyEvent key = 2;
    ScrollEvent scroll = 3;
  }
}

message ActionBatch {
  repeated Action actions = 1;
}

message ActionBatchResponse {
  // Number of actions that executed successfully (always the full batch on a
  // non-error response).
  uint32 executed = 1;
}

message StepRequest {
  repeated Action actions = 1;
  FrameFormat format = 2;
  // Milliseconds to wait between the last action and the capture, for
  // applications that repaint after the input lands. 0 captures immediately;
  // values above the server maximum (currently 2000) are rejected.
  // With wait_for_change this is the longest wait instead, and 0 selects
  // the server default (currently 1000).
  uint32 settle_ms = 3;
  // Capture the first frame whose pixels differ from the frame before the
  // batch, rather than sleeping settle_ms. Returns once a repaint produced
  // different pixels, or after settle_ms with the frame as it is then. A
  // changed frame proves the display repainted, not that the application
  // finished; callers still need their own completion checks.
  bool wait_for_change = 4;
}

// StepResponse keeps a failed action and a failed capture apart from each
// other and from success, because input is not idempotent: neither outcome
// may read as "nothing happened".
message StepResponse {
  // Number of actions that executed. Equals the batch size unless
  // action_error is set, in which case it is also the failing action's index.
  uint32 executed = 1;
  // Why the batch stopped early. Empty when every action ran.
  string action_error = 2;
  // Frame captured after the batch stopped; unset when capture failed.
  ScreenshotResponse screenshot = 3;
  // Why no frame was captured. The executed actions were still delivered.
  string capture_error = 4;
  // Whether the frame differs from the one before the batch. Only set when
  // wait_for_change was requested and the display backend could compare.
  bool changed = 5;
  // Where the request's time went, in milliseconds: running the actions,
  // the fixed settle, and the capture (which includes arming the change
  // watch before the batch and any wait for a changed frame).
  uint32 actions_ms = 6;
  uint32 settle_ms = 7;
  uint32 capture_ms = 8;
}

// Named DesktopResizeRequest/Response (not ResizeRequest/Response) to avoid
// colliding with ProcessService's pid-scoped ResizeRequest — both live in the
// same proto package.
message DesktopResizeRequest {
  uint32 width = 1;
  uint32 height = 2;
}

message DesktopResizeResponse {}
